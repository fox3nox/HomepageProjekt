name: Family Command V9.31 iPhone dashboard regression
on:
  pull_request:
    paths:
      - 'family-command/v9-professional.js'
      - 'family-command/e2e/dashboard-redesign.spec.mjs'
      - 'family-command/sw.js'
      - '.github/workflows/family-command-v931-iphone-dashboard-check.yml'
  push:
    branches: [main]
    paths:
      - 'family-command/v9-professional.js'
      - 'family-command/e2e/dashboard-redesign.spec.mjs'
      - 'family-command/sw.js'
      - '.github/workflows/family-command-v931-iphone-dashboard-check.yml'
jobs:
  iphone-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: V9.31 iPhone dashboard regression
        run: node family-command/e2e/dashboard-redesign.spec.mjs
