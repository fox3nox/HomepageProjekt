name: Family Command full audit regression
on:
  push:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-full-audit-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-full-audit-check.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check every active JavaScript module and regression
        run: |
          set -euo pipefail
          find family-command -maxdepth 1 -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' f; do echo "check $f"; node --check "$f"; done
          find family-command/e2e -maxdepth 1 -type f -name '*.mjs' -print0 | sort -z | while IFS= read -r -d '' f; do echo "check $f"; node --check "$f"; done
      - name: Boot, cache and private-config invariants
        run: |
          set -euo pipefail
          check(){ label="$1"; shift; if "$@"; then echo "ok: $label"; else echo "FAILED: $label"; exit 1; fi; }
          check "boot version" grep -q "const VERSION='20260901-v9350'" family-command/index.html
          check "private rules version" grep -q "PRIVATE_RULES_VERSION='2026-08-31-v2'" family-command/index.html
          check "smart documents wired" grep -q "smart-documents.js" family-command/index.html
          check "reference loader wired" grep -q "reference-mobile-v35.js" family-command/index.html
          check "supported PWA cache" grep -Eq "const CACHE='family-command-v(68|69|70|71|72|73|74|75|76|77|78|79|80|81)'" family-command/sw.js
          check "reference dashboard JS cached" grep -q "reference-dashboard-v36.js" family-command/sw.js
          check "reference dashboard CSS cached" grep -q "reference-dashboard-v36.css" family-command/sw.js
          check "global design cached" grep -q "global-design-v37.css" family-command/sw.js
          check "global design loaded" grep -q "global-design-v37.css" family-command/reference-mobile-v35.js
          check "audit hardening marker" grep -q "v9.26-full-audit-hardening" family-command/build.txt
      - name: Canonical state integrity invariants
        run: |
          set -euo pipefail
          grep -q "allIdentityTombstones:true" family-command/cloud-state.js
          grep -q "preservesDeleteHistory:true" family-command/cloud-state.js
          grep -q "canonicalWriteAck:true" family-command/cloud-state.js
          grep -q "tombstoneGuard:true" family-command/v9-data.js
          node family-command/e2e/cloud-state-merge.spec.mjs
          node family-command/e2e/chat-command-delete.spec.mjs
          node family-command/e2e/private-rule-tombstone.spec.mjs
      - name: Production feature wiring
        run: |
          set -euo pipefail
          for f in core-runtime.js cloud-state.js document-viewer.js smart-documents.js event-details.js chat-command-sync.js app-data-rules.js v9-data.js event-delete-fix.js multi-link-ui.js v9-app.js v9-professional.js reference-mobile-v35.js homework-originals.js; do grep -q "$f" family-command/index.html || { echo "critical module not wired: $f"; exit 1; }; done
          for f in push-v2.js runtime-health.js family-ai-v2.js ai-budget-guard.js family-ai-original-links.js print-planner-v2.js backup-manager.js app-selftest-v9.js; do grep -q "$f" family-command/index.html || { echo "deferred module not wired: $f"; exit 1; }; done
          ! grep -q "family-command-private-app" family-command/index.html
