name: Family Command full audit regression
on:
  push:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-full-audit-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-full-audit-check.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check every active JavaScript module and regression
        run: |
          set -euo pipefail
          find family-command -maxdepth 1 -type f -name '*.js' -print0 | sort -z | while IFS= read -r -d '' f; do echo "check $f"; node --check "$f"; done
          find family-command/e2e -maxdepth 1 -type f -name '*.mjs' -print0 | sort -z | while IFS= read -r -d '' f; do echo "check $f"; node --check "$f"; done
      - name: Boot, cache and private-config invariants
        run: |
          set -euo pipefail
          check(){ label="$1"; shift; if "$@"; then echo "ok: $label"; else echo "FAILED: $label"; exit 1; fi; }
          check "boot version" grep -q "const VERSION='20260904-v9630'" family-command/index.html
          check "current build marker" grep -q "v9.61.7-reminder-surface" family-command/build.txt
          check "private rules version" grep -q "PRIVATE_RULES_VERSION='2026-08-31-v2'" family-command/index.html
          check "smart documents wired" grep -q "smart-documents.js" family-command/index.html
          check "daily check wired" grep -q "daily-check.js" family-command/index.html
          check "daily check styles wired" grep -q "daily-check.css" family-command/index.html
          check "reference loader wired" grep -q "reference-mobile-v35.js" family-command/index.html
          check "shopping lists wired" grep -q "shopping-lists.js" family-command/index.html
          check "shopping styles wired" grep -q "shopping-lists.css" family-command/index.html
          check "meal planner wired" grep -q "meal-planner.js" family-command/index.html
          check "meal planner styles wired" grep -q "meal-planner.css" family-command/index.html
          check "recipe bridge wired" grep -q "recipe-meal-bridge.js" family-command/index.html
          check "recipes wired" grep -q "recipes-favorites.js" family-command/index.html
          check "recipes styles wired" grep -q "recipes-favorites.css" family-command/index.html
          check "budget wired" grep -q "family-budget.js" family-command/index.html
          check "budget styles wired" grep -q "family-budget.css" family-command/index.html
          check "contacts wired" grep -q "family-contacts.js" family-command/index.html
          check "contacts styles wired" grep -q "family-contacts.css" family-command/index.html
          check "reminder center wired" grep -q "reminder-center.js" family-command/index.html
          check "unified design wired" grep -q "v9-unified-design-v958.css" family-command/index.html
          check "page polish wired" grep -q "v9-page-polish-v959.css" family-command/index.html
          check "form dialog polish imported" grep -q "v9-form-dialog-polish-v960.css" family-command/v9-page-polish-v959.css
          check "interaction accessibility polish imported" grep -q "v9-interaction-accessibility-v961.css" family-command/v9-page-polish-v959.css
          check "supported PWA cache" grep -Eq "const CACHE='family-command-v(68|69|70|71|72|73|74|75|76|77|78|79|80|81|82|83|84|85|86|87|88|89|90|91|92|93|94|95|96|97|98|99|100|101)'" family-command/sw.js
          check "daily check JS cached" grep -q "daily-check.js" family-command/sw.js
          check "daily check CSS cached" grep -q "daily-check.css" family-command/sw.js
          check "reference dashboard JS cached" grep -q "reference-dashboard-v36.js" family-command/sw.js
          check "reference dashboard CSS cached" grep -q "reference-dashboard-v36.css" family-command/sw.js
          check "global design cached" grep -q "global-design-v37.css" family-command/sw.js
          check "product design cached" grep -q "v9-product-design.css" family-command/sw.js
          check "responsive design cached" grep -q "v9-responsive-v946.css" family-command/sw.js
          check "mobile school JS cached" grep -q "mobile-school-day-v947.js" family-command/sw.js
          check "mobile school CSS cached" grep -q "mobile-school-day-v947.css" family-command/sw.js
          check "iphone layout CSS cached" grep -q "v9-iphone-layout-v948.css" family-command/sw.js
          check "iphone layout JS cached" grep -q "v9-iphone-layout-v948.js" family-command/sw.js
          check "visual polish cached" grep -q "v9-visual-polish-v949.css" family-command/sw.js
          check "mobile polish cached" grep -q "v9-mobile-polish-v952.css" family-command/sw.js
          check "unified design cached" grep -q "v9-unified-design-v958.css" family-command/sw.js
          check "final unity cached" grep -q "v9-final-unity-v9618.css" family-command/sw.js
          check "design system cached" grep -q "v9-design-system-v9619.css" family-command/sw.js
          check "final layout cached" grep -q "v9-layout-final-v9622.css" family-command/sw.js
          check "page polish cached" grep -q "v9-page-polish-v959.css" family-command/sw.js
          check "form dialog polish cached" grep -q "v9-form-dialog-polish-v960.css" family-command/sw.js
          check "interaction accessibility polish cached" grep -q "v9-interaction-accessibility-v961.css" family-command/sw.js
          check "shopping JS cached" grep -q "shopping-lists.js" family-command/sw.js
          check "shopping CSS cached" grep -q "shopping-lists.css" family-command/sw.js
          check "meal JS cached" grep -q "meal-planner.js" family-command/sw.js
          check "meal CSS cached" grep -q "meal-planner.css" family-command/sw.js
          check "recipe bridge cached" grep -q "recipe-meal-bridge.js" family-command/sw.js
          check "recipe JS cached" grep -q "recipes-favorites.js" family-command/sw.js
          check "recipe CSS cached" grep -q "recipes-favorites.css" family-command/sw.js
          check "budget JS cached" grep -q "family-budget.js" family-command/sw.js
          check "budget CSS cached" grep -q "family-budget.css" family-command/sw.js
          check "contacts JS cached" grep -q "family-contacts.js" family-command/sw.js
          check "contacts CSS cached" grep -q "family-contacts.css" family-command/sw.js
          check "reminder center cached" grep -q "reminder-center.js" family-command/sw.js
          check "global design loaded" grep -q "global-design-v37.css" family-command/reference-mobile-v35.js
          check "product design loaded" grep -q "v9-product-design.css" family-command/reference-mobile-v35.js
          check "responsive design loaded" grep -q "v9-responsive-v946.css" family-command/reference-mobile-v35.js
          check "mobile school JS loaded" grep -q "mobile-school-day-v947.js" family-command/reference-mobile-v35.js
          check "mobile school CSS loaded" grep -q "mobile-school-day-v947.css" family-command/reference-mobile-v35.js
          check "iphone layout CSS loaded" grep -q "v9-iphone-layout-v948.css" family-command/reference-mobile-v35.js
          check "iphone layout JS loaded" grep -q "v9-iphone-layout-v948.js" family-command/reference-mobile-v35.js
          check "visual polish loaded" grep -q "v9-visual-polish-v949.css" family-command/reference-mobile-v35.js
          check "mobile polish loaded" grep -q "v9-mobile-polish-v952.css" family-command/reference-mobile-v35.js
          check "final layout loaded" grep -q "v9-layout-final-v9622.css" family-command/reference-mobile-v35.js
          check "final layout marker" grep -q "fcFinalLayout='v9622'" family-command/reference-mobile-v35.js
          check "responsive design version" grep -q "20260903-v9520" family-command/reference-mobile-v35.js
          check "iphone layout marker" grep -q "fcIphoneLayout='v48'" family-command/reference-mobile-v35.js
          check "visual polish compatibility marker" grep -q "fcGlobalPolish='v49'" family-command/reference-mobile-v35.js
          check "mobile polish marker" grep -q "fcMobilePolish='v52'" family-command/reference-mobile-v35.js
          check "audit hardening marker" grep -q "v9.26-full-audit-hardening" family-command/build.txt
      - name: Canonical state integrity invariants
        run: |
          set -euo pipefail
          grep -q "allIdentityTombstones:true" family-command/cloud-state.js
          grep -q "preservesDeleteHistory:true" family-command/cloud-state.js
          grep -q "canonicalWriteAck:true" family-command/cloud-state.js
          grep -q "tombstoneGuard:true" family-command/v9-data.js
          node family-command/e2e/cloud-state-merge.spec.mjs
          node family-command/e2e/chat-command-delete.spec.mjs
          node family-command/e2e/private-rule-tombstone.spec.mjs
      - name: Production feature wiring
        run: |
          set -euo pipefail
          for f in core-runtime.js cloud-state.js document-viewer.js smart-documents.js event-details.js chat-command-sync.js app-data-rules.js v9-data.js event-delete-fix.js multi-link-ui.js v9-app.js daily-check.js shopping-lists.js meal-planner.js recipe-meal-bridge.js recipes-favorites.js family-budget.js family-contacts.js reminder-center.js v9-professional.js reference-mobile-v35.js homework-originals.js; do grep -q "$f" family-command/index.html || { echo "critical module not wired: $f"; exit 1; }; done
          for f in push-v2.js runtime-health.js family-ai-v2.js ai-budget-guard.js family-ai-original-links.js print-planner-v2.js backup-manager.js app-selftest-v9.js; do grep -q "$f" family-command/index.html || { echo "deferred module not wired: $f"; exit 1; }; done
          ! grep -q "family-command-private-app" family-command/index.html
