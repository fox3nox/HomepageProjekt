name: Family Command sanity check
on:
  push:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-pro67-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/**'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check family-command/today-relevance.js
          node --check family-command/tomorrow-preview.js
          node --check family-command/tomorrow-screen.js
          node --check family-command/nav-six-fix.js
          node --check family-command/daily-checklist.js
          node --check family-command/print-planner-v2.js
          node --check family-command/week-overview-v2.js
          node --check family-command/app-selftest-v6.js
          node --check family-command/smoke-tests.js
          node --check family-command/sw.js
      - name: Navigation and PWA wiring
        run: |
          grep -q "nav-six-fix.js" family-command/sw.js
          grep -q "tomorrow-screen.js" family-command/sw.js
          grep -q "daily-checklist.js" family-command/sw.js
          grep -q "print-planner-v2.js" family-command/sw.js
          grep -q "week-overview-v2.js" family-command/sw.js
          grep -q "family-command-v20" family-command/sw.js
          grep -q "pro6.10" family-command/build.txt
          grep -q "data-screen=\\\"tomorrow\\\"" family-command/nav-six-fix.js
          grep -q "repeat(6" family-command/nav-six-fix.js
