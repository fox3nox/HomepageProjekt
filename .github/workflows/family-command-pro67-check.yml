name: Family Command sanity check
on:
  push:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-pro67-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/**'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check family-command/app-data-rules.js
          node --check family-command/today-relevance.js
          node --check family-command/tomorrow-preview.js
          node --check family-command/tomorrow-screen.js
          node --check family-command/daily-checklist.js
          node --check family-command/todo-list.js
          node --check family-command/print-planner-v2.js
          node --check family-command/todo-print-addon.js
          node --check family-command/today-addons-stabilizer.js
          node --check family-command/app-selftest-v6.js
          node --check family-command/v8-shell.js
          node --check family-command/v8-ui.js
          node --check family-command/chat-command-sync.js
          node --check family-command/smoke-tests.js
          node --check family-command/sw.js
      - name: V8.4 lean startup and sync regression
        run: |
          grep -q "family-command-v32" family-command/sw.js
          grep -q "chat-command-sync.js" family-command/sw.js
          grep -q "if(cached){event.waitUntil" family-command/sw.js
          grep -q "v8.4-lean" family-command/build.txt
          grep -q "20260828-v840" family-command/index.html
          grep -q "v8.4-lean-ok" family-command/index.html
          grep -q "const CRITICAL=" family-command/index.html
          grep -q "const DEFERRED=" family-command/index.html
          grep -q "PRIVATE_CACHE" family-command/index.html
          grep -q "deferExtras" family-command/index.html
          grep -q "force-cache" family-command/index.html
          grep -q "fcBootMs" family-command/index.html
          grep -q "version:'8.4-lean'" family-command/v8-shell.js
          grep -q "renderedAt" family-command/v8-shell.js
          ! grep -q "warmScreens" family-command/v8-shell.js
          grep -q "version:2" family-command/chat-command-sync.js
          grep -q "refreshVisible" family-command/chat-command-sync.js
          grep -q "todosAt" family-command/tomorrow-preview.js
          grep -q ">To-dos<" family-command/tomorrow-preview.js
          grep -q "groupedNext" family-command/today-addons-stabilizer.js
          grep -q "v8-hide-empty-todo" family-command/v8-ui.js
          ! grep -q "events-visibility-fix.js" family-command/index.html
          ! grep -q "MutationObserver" family-command/v8-ui.js
          ! grep -q "MutationObserver" family-command/v8-shell.js
          ! grep -q "MutationObserver" family-command/today-addons-stabilizer.js
          ! grep -q "screen-redesign-v6.css" family-command/index.html
          ! grep -q "v7-ui.css" family-command/index.html
          ! grep -q "v7-ui.js" family-command/index.html
          ! grep -q "nav-six-fix.js" family-command/index.html
      - name: Eliyah Tuesday regression
        run: |
          grep -q "eliyahTuesday" family-command/app-data-rules.js
          grep -q "13:15" family-command/app-data-rules.js
          grep -q "13:25" family-command/app-data-rules.js
          grep -q "Losgehzeit ist nicht hinterlegt" family-command/today-relevance.js
