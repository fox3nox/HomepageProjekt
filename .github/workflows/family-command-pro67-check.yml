name: Family Command sanity check
on:
  push:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-pro67-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/**'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check family-command/app-data-rules.js
          node --check family-command/today-relevance.js
          node --check family-command/tomorrow-preview.js
          node --check family-command/tomorrow-screen.js
          node --check family-command/nav-six-fix.js
          node --check family-command/daily-checklist.js
          node --check family-command/todo-list.js
          node --check family-command/print-planner-v2.js
          node --check family-command/todo-print-addon.js
          node --check family-command/week-overview-v2.js
          node --check family-command/today-addons-stabilizer.js
          node --check family-command/events-visibility-fix.js
          node --check family-command/pinboard-dashboard.js
          node --check family-command/app-selftest-v6.js
          node --check family-command/smoke-tests.js
          node --check family-command/sw.js
      - name: Navigation and PWA wiring
        run: |
          grep -q "nav-six-fix.js" family-command/sw.js
          grep -q "tomorrow-screen.js" family-command/sw.js
          grep -q "daily-checklist.js" family-command/sw.js
          grep -q "todo-list.js" family-command/sw.js
          grep -q "print-planner-v2.js" family-command/sw.js
          grep -q "todo-print-addon.js" family-command/sw.js
          grep -q "week-overview-v2.js" family-command/sw.js
          grep -q "today-addons-stabilizer.js" family-command/sw.js
          grep -q "events-visibility-fix.js" family-command/sw.js
          grep -q "pinboard-dashboard.js" family-command/sw.js
          grep -q "event-details.js" family-command/sw.js
          grep -q "family-command-v27" family-command/sw.js
          grep -q "pro6.17" family-command/build.txt
          grep -q "20260825-pro615" family-command/index.html
          grep -q "events-visibility-fix.js" family-command/index.html
          grep -q "fc_retry" family-command/index.html
          grep -q "pro6.15-ok" family-command/index.html
          grep -q "data-fc-ready" family-command/index.html
          ! grep -q "loadScript('./smoke-tests.js" family-command/index.html
          ! grep -q "'./smoke-tests.js'" family-command/sw.js
          grep -q "data-screen=\\\"tomorrow\\\"" family-command/nav-six-fix.js
          grep -q "repeat(6" family-command/nav-six-fix.js
          grep -q "groupedNext" family-command/today-addons-stabilizer.js
          grep -q "personIds" family-command/events-visibility-fix.js
          grep -q "Kommende Termine" family-command/events-visibility-fix.js
          grep -q "loadPinboard" family-command/app-selftest-v6.js
          grep -q "DEINE PINNWAND" family-command/pinboard-dashboard.js
          grep -q "NÄCHSTE 7 TAGE" family-command/pinboard-dashboard.js
      - name: Eliyah Tuesday regression
        run: |
          grep -q "eliyahTuesday" family-command/app-data-rules.js
          grep -q "13:15" family-command/app-data-rules.js
          grep -q "13:25" family-command/app-data-rules.js
          grep -q "Losgehzeit ist nicht hinterlegt" family-command/today-relevance.js
