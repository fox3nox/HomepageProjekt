name: Family Command quality gate
on:
  push:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-pro67-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-pro67-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check family-command/v9-app.js
          node --check family-command/v9-professional.js
          node --check family-command/v9-data.js
          node --check family-command/app-data-rules.js
          node --check family-command/chat-command-sync.js
          node --check family-command/event-details.js
          node --check family-command/event-delete-fix.js
          node --check family-command/multi-link-ui.js
          node --check family-command/homework-originals.js
          node --check family-command/print-planner-v2.js
          node --check family-command/sw.js
          node --check family-command/e2e/mock-private-core.js
          node --check family-command/e2e/ui.spec.mjs
      - name: V9 architecture regression
        run: |
          grep -q "20260829-v920" family-command/index.html
          grep -q "v9-clean-ok" family-command/index.html
          grep -q "window.__fcV9Boot=true" family-command/index.html
          grep -q "executePrivate" family-command/index.html
          grep -q "v9-app.js" family-command/index.html
          grep -q "v9-data.js" family-command/index.html
          grep -q "v9-professional.js" family-command/index.html
          grep -q "v9-professional.css" family-command/index.html
          grep -q "Familienzentrale" family-command/index.html
          grep -q '"short_name":"Familie"' family-command/manifest.webmanifest
          grep -q "Vergangene Termine" family-command/v9-professional.js
          grep -q "family-command-v42" family-command/sw.js
          grep -q "print-planner-v2.js" family-command/sw.js
          grep -q "responsive Tages-/Wochenplan" family-command/print-planner-v2.js
          grep -q "PDF / Drucken" family-command/print-planner-v2.js
          grep -q "application/pdf" family-command/print-planner-v2.js
          grep -q "Fruchtfliegenfalle für meine Frau in der LANDI kaufen" family-command/v9-data.js
          grep -q "Morgen erledigen" family-command/v9-app.js
          grep -q "window.__fcV9" family-command/v9-app.js
          test -s family-command/apple-touch-icon.png
          test -s family-command/icon-192.png
          ! grep -q "todo-print-addon.js" family-command/index.html
          ! grep -q "screen-redesign-v6.js" family-command/index.html
          ! grep -q "today-relevance.js" family-command/index.html
          ! grep -q "tomorrow-screen.js" family-command/index.html
          ! grep -q "todo-list.js" family-command/index.html
          ! grep -q "tomorrow-preview.js" family-command/index.html
          ! grep -q "today-addons-stabilizer.js" family-command/index.html
          ! grep -q "v8-shell.js" family-command/index.html
          ! grep -q "v8-ui.js" family-command/index.html
          ! grep -q "ignoreSearch:true" family-command/sw.js
          grep -q "async function navigation" family-command/sw.js
          grep -q "13:15" family-command/app-data-rules.js
          grep -q "Tagesschule holt Eliyah" family-command/app-data-rules.js
      - name: Validate PWA icon files
        run: |
          python3 - <<'PY'
          import struct
          def png_size(path):
              with open(path,'rb') as f: data=f.read(24)
              assert data[:8] == b'\x89PNG\r\n\x1a\n', path+' is not a PNG'
              return struct.unpack('>II',data[16:24])
          assert png_size('family-command/apple-touch-icon.png') == (180,180)
          assert png_size('family-command/icon-192.png') == (192,192)
          print('PWA icons valid')
          PY
      - name: Install Playwright WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps webkit
      - name: iPhone WebKit end-to-end
        run: node family-command/e2e/ui.spec.mjs
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-command-v9-iphone-screenshots
          path: family-command/e2e-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
