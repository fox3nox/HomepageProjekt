          grep -q "v9Native:true" family-command/event-delete-fix.js
          grep -q "__fcEventDeleteInstalled" family-command/event-delete-fix.js
          grep -q "legacyGuard:false" family-command/event-delete-fix.js
          ! grep -q "__fcEventDeleteV6" family-command/event-delete-fix.js
          ! grep -q "__fcV8Shell" family-command/event-delete-fix.js
          grep -q "legacyBundle:false" family-command/runtime-health.js
          ! grep -q "legacyPushDisabled" family-command/runtime-health.js
          grep -q "const VERSION='9.9.0'" family-command/v9-app.js
          grep -q "function installRuntimeAPI" family-command/v9-app.js
          ! grep -q "installCompatibility" family-command/v9-app.js
          ! grep -q "installEventDetailActions" family-command/v9-app.js
          ! grep -q "fc9-detail-actions" family-command/v9-app.js
          ! grep -q "v6HomeworkMenu" family-command/v9-app.js
          ! grep -q "v6OpenHomework" family-command/v9-app.js
          ! grep -q "v6EditHomework" family-command/v9-app.js
          ! grep -q "v6EditEvent" family-command/v9-app.js
          ! grep -q "__fcV8Shell" family-command/v9-app.js
          grep -q "fcHomeworkOriginals.*open" family-command/v9-app.js
          grep -q "function eventIsPast" family-command/v9-app.js
          grep -q "function eventSections" family-command/v9-app.js
          grep -q "fc9-past-toggle" family-command/v9-app.js
          grep -q "fc9-past-badge" family-command/v9-app.js
          grep -q "version:'9.11.0'" family-command/v9-professional.js
          grep -q "renderWrappers:false" family-command/v9-professional.js
          grep -q "calendarPostProcessor:false" family-command/v9-professional.js
          ! grep -q "polishCalendar" family-command/v9-professional.js
          ! grep -q "splitPastSection" family-command/v9-professional.js
          ! grep -q "renderEvents" family-command/v9-professional.js
          ! grep -q "renderWeek" family-command/v9-professional.js
          ! grep -q "__fcV9.open" family-command/v9-professional.js
          grep -q "version:'3.0.0'" family-command/homework-originals.js
          ! grep -q "v6HomeworkMenu" family-command/homework-originals.js
          grep -q "__fcEventDetailsHealth" family-command/event-details.js
          grep -q "version:3" family-command/event-details.js
          grep -q "v9Native:true" family-command/event-details.js
          grep -q "mutationObserver:false" family-command/event-details.js
          grep -q "renderWrappers:false" family-command/event-details.js
          grep -q "legacySelectors:false" family-command/event-details.js
          grep -q "nativeActions:true" family-command/event-details.js
          grep -q "editNative:true" family-command/event-details.js
          grep -q "deleteViaTombstones:true" family-command/event-details.js
          grep -q "fcEditEventDetails" family-command/event-details.js
          grep -q "fcDeleteEventDetails" family-command/event-details.js
          grep -q "fc-detail-edit" family-command/event-details.js
          grep -q "fc-detail-delete" family-command/event-details.js
          grep -q "fc-event-edit-sheet" family-command/event-details.js
          grep -q "fc-detail-pick" family-command/event-details.js
          grep -q "fc-picker-sheet" family-command/event-details.js
          grep -q "window.removeEvent" family-command/event-details.js
          ! grep -q "MutationObserver" family-command/event-details.js
          ! grep -q "pro-event" family-command/event-details.js
          ! grep -q "fc-7day" family-command/event-details.js
          ! grep -q "pro-modal" family-command/event-details.js
          ! grep -q "pro-sheet" family-command/event-details.js
          ! grep -q "enhanceEventCards" family-command/event-details.js
          ! grep -q "enhance7Day" family-command/event-details.js
          ! grep -q "renderEvents" family-command/event-details.js
          ! grep -q "renderToday" family-command/event-details.js
          ! grep -q "renderWeek" family-command/event-details.js
          grep -q "v9Native:true" family-command/backup-manager.js
          grep -q "legacySelectors:false" family-command/backup-manager.js
          grep -q "renderWrapper:false" family-command/backup-manager.js
          ! grep -q "\.v6-page" family-command/backup-manager.js
          ! grep -q "\.screen.active" family-command/backup-manager.js
          ! grep -q "__fcV8Shell" family-command/backup-manager.js
          ! grep -q "renderMore" family-command/backup-manager.js
          grep -q "eventDetailsHealth" family-command/e2e/ui.spec.mjs
          grep -q "nativeActions" family-command/e2e/ui.spec.mjs
          grep -q "fc-detail-edit" family-command/e2e/ui.spec.mjs
          grep -q "fcEventEdit" family-command/e2e/ui.spec.mjs
          grep -q "fc-detail-delete" family-command/e2e/ui.spec.mjs
          grep -q "fc-deleted-events-v1" family-command/e2e/ui.spec.mjs
          grep -q "eventDeleteV6" family-command/e2e/ui.spec.mjs
          grep -q "nativeDeleteGuard" family-command/e2e/ui.spec.mjs
          grep -q "fc-detail-pick" family-command/e2e/ui.spec.mjs
          grep -q "fcDocPicker" family-command/e2e/ui.spec.mjs
          grep -q "family-command-backups" family-command/e2e/ui.spec.mjs
          grep -q "fc-bu-sheet" family-command/e2e/ui.spec.mjs
          grep -q "oldGlobals" family-command/e2e/ui.spec.mjs
          grep -q "v9Version.*9.9.0" family-command/e2e/ui.spec.mjs
          grep -q "Vergangene Termine" family-command/e2e/ui.spec.mjs
          grep -q "Vergangen" family-command/e2e/ui.spec.mjs
          ! grep -q "visit-fixture-2" family-command/e2e/ui.spec.mjs
          grep -q "document-viewer.spec.mjs" .github/workflows/family-command-pro67-check.yml
          grep -q "Lesefassung" family-command/e2e/document-viewer.spec.mjs
          grep -q "data-zoom-in" family-command/e2e/document-viewer.spec.mjs
          grep -q "390,844" family-command/e2e/document-viewer.spec.mjs
          grep -q "430,932" family-command/e2e/document-viewer.spec.mjs
          test -s family-command/apple-touch-icon.png
          test -s family-command/icon-192.png
          ! grep -qi "Fruchtfliegenfalle" family-command/v9-data.js
          ! grep -qi "Kaffee bei Tanja" family-command/v9-data.js
          ! grep -qi "Fruchtfliegenfalle" family-command/app-data-rules.js
          ! grep -qi "Tagesschule holt Eliyah" family-command/app-data-rules.js
          ! grep -qi "Frau Roth" family-command/e2e/ui.spec.mjs
          ! grep -qi "Kaffee bei Tanja" family-command/e2e/ui.spec.mjs
          ! grep -qi "Fruchtfliegenfalle" family-command/e2e/mock-private-rules.js
          ! grep -qi "Frau Roth" family-command/e2e/mock-private-core.js
          ! grep -qi "Kaffee bei Tanja" family-command/e2e/mock-private-core.js
          for f in app.js app-selftest-v6.js balanced-ui.js daily-checklist.js events-controls-fix.js events-visibility-fix.js fixes.js layout-safety.js nav-six-fix.js pendencies.js pro-ui.js professional-ui.js screen-redesign-v6.css screen-redesign-v6.js smoke-tests.js styles.css today-addons-stabilizer.js today-relevance.js todo-list.js todo-print-addon.js tomorrow-preview.js tomorrow-screen.js v7-ui.css v7-ui.js v8-foundation.css v8-overrides.css v8-shell.js v8-ui.css v8-ui.js week-overview-v2.js; do
            test ! -e "family-command/$f" || { echo "Legacy file still present: $f"; exit 1; }
          done
          grep -q "async function navigation" family-command/sw.js
      - name: Validate PWA icon files
        run: |
          python3 - <<'PY'
          import struct
          def png_size(path):
              with open(path,'rb') as f: data=f.read(24)
              assert data[:8] == b'\x89PNG\r\n\x1a\n', path+' is not a PNG'
              return struct.unpack('>II',data[16:24])
          assert png_size('family-command/apple-touch-icon.png') == (180,180)
          assert png_size('family-command/icon-192.png') == (192,192)
          print('PWA icons valid')
          PY
      - name: Install Playwright WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps webkit
      - name: iPhone WebKit end-to-end
        run: |
          node family-command/e2e/ui.spec.mjs
          node family-command/e2e/document-viewer.spec.mjs
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-command-v9-iphone-screenshots
          path: family-command/e2e-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7