name: Family Command quality gate
on:
  push:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-pro67-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-pro67-check.yml'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check family-command/core-runtime.js
          node --check family-command/cloud-state.js
          node --check family-command/v9-app.js
          node --check family-command/v9-professional.js
          node --check family-command/v9-data.js
          node --check family-command/app-data-rules.js
          node --check family-command/chat-command-sync.js
          node --check family-command/event-details.js
          node --check family-command/event-delete-fix.js
          node --check family-command/multi-link-ui.js
          node --check family-command/homework-originals.js
          node --check family-command/runtime-health.js
          node --check family-command/print-planner-v2.js
          node --check family-command/app-selftest-v9.js
          node --check family-command/sw.js
          node --check family-command/e2e/mock-private-core.js
          node --check family-command/e2e/mock-private-rules.js
          node --check family-command/e2e/ui.spec.mjs
      - name: V9.7 clean runtime regression
        run: |
          grep -q "20260830-v970" family-command/index.html
          grep -q "v9-runtime-ok" family-command/index.html
          grep -q "core-runtime.js" family-command/index.html
          grep -q "__fcCoreRuntime" family-command/index.html
          grep -q "cloud-state.js" family-command/index.html
          grep -q "__fcCloudState.*bootstrap" family-command/index.html
          grep -q "family-command-private-config" family-command/index.html
          ! grep -q "family-command-private-app" family-command/index.html
          ! grep -q "executePrivate" family-command/index.html
          ! grep -q "PRIVATE_CODE_VERSION" family-command/index.html
          grep -q "no private UI bundle" family-command/core-runtime.js
          grep -q "legacyBundle:false" family-command/core-runtime.js
          grep -q "family-command-state-v2" family-command/cloud-state.js
          grep -q "canonical Supabase state" family-command/cloud-state.js
          grep -q "FC_PRIVATE_RULES" family-command/app-data-rules.js
          grep -q "FC_PRIVATE_RULES" family-command/v9-data.js
          grep -q "v9-app.js" family-command/index.html
          grep -q "v9-professional.js" family-command/index.html
          grep -q "app-selftest-v9.js" family-command/index.html
          ! grep -q "app-selftest-v6.js" family-command/index.html
          grep -q "legacyLoaders:false" family-command/app-selftest-v9.js
          ! grep -q "nav-six-fix.js" family-command/app-selftest-v9.js
          ! grep -q "tomorrow-screen.js" family-command/app-selftest-v9.js
          grep -q "Familienzentrale" family-command/index.html
          grep -q '"short_name":"Familie"' family-command/manifest.webmanifest
          grep -q "Vergangene Termine" family-command/v9-professional.js
          grep -q "family-command-v47" family-command/sw.js
          grep -q "core-runtime.js" family-command/sw.js
          grep -q "cloud-state.js" family-command/sw.js
          grep -q "print-planner-v2.js" family-command/sw.js
          grep -q "app-selftest-v9.js" family-command/sw.js
          grep -q "application/pdf" family-command/print-planner-v2.js
          grep -q "v9Native:true" family-command/event-delete-fix.js
          ! grep -q "__fcV8Shell" family-command/event-delete-fix.js
          grep -q "legacyBundle:false" family-command/runtime-health.js
          ! grep -q "legacyPushDisabled" family-command/runtime-health.js
          grep -q "version:'2.1.0'" family-command/homework-originals.js
          grep -q "window.v6HomeworkMenu=open" family-command/homework-originals.js
          test -s family-command/apple-touch-icon.png
          test -s family-command/icon-192.png
          ! grep -qi "Fruchtfliegenfalle" family-command/v9-data.js
          ! grep -qi "Kaffee bei Tanja" family-command/v9-data.js
          ! grep -qi "Fruchtfliegenfalle" family-command/app-data-rules.js
          ! grep -qi "Tagesschule holt Eliyah" family-command/app-data-rules.js
          ! grep -qi "Frau Roth" family-command/e2e/ui.spec.mjs
          ! grep -qi "Kaffee bei Tanja" family-command/e2e/ui.spec.mjs
          ! grep -qi "Fruchtfliegenfalle" family-command/e2e/mock-private-rules.js
          ! grep -qi "Frau Roth" family-command/e2e/mock-private-core.js
          ! grep -qi "Kaffee bei Tanja" family-command/e2e/mock-private-core.js
          for f in app.js app-selftest-v6.js balanced-ui.js daily-checklist.js events-controls-fix.js events-visibility-fix.js fixes.js layout-safety.js nav-six-fix.js pendencies.js pro-ui.js professional-ui.js screen-redesign-v6.css screen-redesign-v6.js smoke-tests.js styles.css today-addons-stabilizer.js today-relevance.js todo-list.js todo-print-addon.js tomorrow-preview.js tomorrow-screen.js v7-ui.css v7-ui.js v8-foundation.css v8-overrides.css v8-shell.js v8-ui.css v8-ui.js week-overview-v2.js; do
            test ! -e "family-command/$f" || { echo "Legacy file still present: $f"; exit 1; }
          done
          grep -q "async function navigation" family-command/sw.js
      - name: Validate PWA icon files
        run: |
          python3 - <<'PY'
          import struct
          def png_size(path):
              with open(path,'rb') as f: data=f.read(24)
              assert data[:8] == b'\x89PNG\r\n\x1a\n', path+' is not a PNG'
              return struct.unpack('>II',data[16:24])
          assert png_size('family-command/apple-touch-icon.png') == (180,180)
          assert png_size('family-command/icon-192.png') == (192,192)
          print('PWA icons valid')
          PY
      - name: Install Playwright WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
          npx playwright install --with-deps webkit
      - name: iPhone WebKit end-to-end
        run: node family-command/e2e/ui.spec.mjs
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-command-v9-iphone-screenshots
          path: family-command/e2e-artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
