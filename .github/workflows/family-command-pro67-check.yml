name: Family Command sanity check
on:
  push:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-pro67-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/**'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check family-command/app-data-rules.js
          node --check family-command/today-relevance.js
          node --check family-command/tomorrow-preview.js
          node --check family-command/tomorrow-screen.js
          node --check family-command/todo-list.js
          node --check family-command/pendencies.js
          node --check family-command/multi-link-ui.js
          node --check family-command/event-delete-fix.js
          node --check family-command/ai-budget-guard.js
          node --check family-command/print-planner-v2.js
          node --check family-command/todo-print-addon.js
          node --check family-command/today-addons-stabilizer.js
          node --check family-command/app-selftest-v6.js
          node --check family-command/v8-shell.js
          node --check family-command/v8-ui.js
          node --check family-command/chat-command-sync.js
          node --check family-command/smoke-tests.js
          node --check family-command/sw.js
      - name: V8.5 audited runtime regression
        run: |
          grep -q "family-command-v33" family-command/sw.js
          grep -q "v8.5-audit" family-command/build.txt
          grep -q "20260828-v850" family-command/index.html
          grep -q "v8.5-audit-ok" family-command/index.html
          grep -q "window.__fcManagedBoot=true" family-command/index.html
          grep -q "PRIVATE_CODE_VERSION='family-command-app-v3-managed1'" family-command/index.html
          grep -q "NO_OBSERVER=new Set(\['event-details.js'\])" family-command/index.html
          grep -q "const CRITICAL=" family-command/index.html
          grep -q "const DEFERRED=" family-command/index.html
          ! grep -q "daily-checklist.js'" family-command/index.html
          grep -q "version:'8.5-audit'" family-command/v8-shell.js
          grep -q "const dirty=new Set" family-command/v8-shell.js
          ! grep -q "renderedAt" family-command/v8-shell.js
          ! grep -q "setTimeout(()=>post" family-command/v8-shell.js
          grep -q "fc-chat-todos-v2" family-command/chat-command-sync.js
          grep -q "hydrateLocal" family-command/chat-command-sync.js
          grep -q "getTodosFor" family-command/chat-command-sync.js
          grep -q "dismiss" family-command/chat-command-sync.js
          grep -q "chat-2026-08-28-fruchtfliegenfalle-landi-bezahlt-v2" family-command/app-data-rules.js
          grep -q "bereits bezahlt, kein Geld mehr verlangen" family-command/app-data-rules.js
          grep -q "version:2,rowsFor" family-command/todo-list.js
          ! grep -q "setTimeout(renderAll,1000)" family-command/todo-list.js
          ! grep -q "MutationObserver" family-command/multi-link-ui.js
          ! grep -q "MutationObserver" family-command/event-delete-fix.js
          ! grep -q "MutationObserver" family-command/ai-budget-guard.js
          grep -q "todosAt" family-command/tomorrow-preview.js
          grep -q ">To-dos<" family-command/tomorrow-preview.js
          grep -q "groupedNext" family-command/today-addons-stabilizer.js
          ! grep -q "events-visibility-fix.js" family-command/index.html
          ! grep -q "screen-redesign-v6.css" family-command/index.html
          ! grep -q "v7-ui.js" family-command/index.html
          ! grep -q "nav-six-fix.js" family-command/index.html
      - name: School schedule regression
        run: |
          grep -q "13:15" family-command/app-data-rules.js
          grep -q "13:25" family-command/app-data-rules.js
          grep -q "Tagesschule holt Eliyah" family-command/app-data-rules.js
          grep -q "Losgehzeit ist nicht hinterlegt" family-command/today-relevance.js
