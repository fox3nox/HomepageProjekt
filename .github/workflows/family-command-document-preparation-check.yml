name: Family Command document preparation regression
on:
  push:
    branches: [main, feat/document-review-and-event-preparation-20260907]
    paths: ['family-command/**', '.github/workflows/family-command-document-preparation-check.yml']
  pull_request:
    branches: [main]
    paths: ['family-command/**', '.github/workflows/family-command-document-preparation-check.yml']
permissions:
  contents: read
jobs:
  document-preparation:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, chromium]
    env:
      FC_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v4
      - name: Source and confirmation invariants
        run: |
          node --check family-command/core-runtime.js
          node --check family-command/smart-documents.js
          node --check family-command/reference-dashboard-v36.js
          node --check family-command/tomorrow-calendar-v9673.js
          node family-command/e2e/event-preparation-unit.spec.mjs
          node family-command/e2e/document-review-unit.spec.mjs
      - name: Install matching browser driver
        run: npm install --no-save --package-lock=false playwright@1.57.0
      - name: Existing document import regression
        run: node family-command/e2e/smart-documents.spec.mjs
      - name: Existing document center regression
        if: matrix.browser == 'webkit'
        run: node family-command/e2e/document-center-v951.spec.mjs
      - name: Confirmed document to event preparation integration
        if: success() || failure()
        run: node family-command/e2e/document-review-preparation.spec.mjs
      - name: Browser review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-preparation-${{ matrix.browser }}
          path: qa-document-preparation/
          if-no-files-found: warn
          retention-days: 7
      - name: Preserve exact reviewed public source for isolated QA
        if: matrix.browser == 'webkit' && github.event_name != 'push'
        uses: actions/upload-artifact@v4
        with:
          name: document-preparation-reviewed-source
          path: |
            family-command/
            .github/workflows/
          include-hidden-files: true
          retention-days: 3
  published-baseline:
    if: github.event_name == 'pull_request' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify current main against published entry point
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://raw.githubusercontent.com/fox3nox/HomepageProjekt/main/family-command/index.html?qa=${GITHUB_RUN_ID}" -o /tmp/main-index.html
          curl --fail --silent --show-error --location --header 'Cache-Control: no-cache' "https://fox3nox.github.io/HomepageProjekt/family-command/index.html?qa=${GITHUB_RUN_ID}" -o /tmp/live-index.html
          cmp /tmp/main-index.html /tmp/live-index.html
          sha256sum /tmp/main-index.html /tmp/live-index.html
          grep -q '<title>Familienzentrale</title>' /tmp/live-index.html
          echo 'Current main entry point matches the actual published page. Full release asset hashes are verified by production smoke after merge.'
