name: Finalize V9.74 actionability
on:
  push:
    branches: [feat/v974-command-center]
    paths: [.github/workflows/family-command-v974-actionability.yml]
permissions:
  contents: write
jobs:
  patch:
    if: github.repository == 'fox3nox/HomepageProjekt' && github.ref == 'refs/heads/feat/v974-command-center'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.sha }}' }
      - name: Apply command-center actionability patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('family-command/reference-dashboard-v36.js');s=p.read_text()
          start=s.index('function actionPanel(){');end=s.index('function childrenAction(){',start)
          action="""function actionPanel(){const work=dueWork(),next=remainingEvents()[0]||null,action=window.__fcV9?.nextAction?.()||null,rows=[];for(const t of work.slice(0,4))rows.push(taskRow(t));if(!rows.length&&next)rows.push(eventRow(next));const count=work.length,summary=count?`${count} ${count===1?'offener Punkt':'offene Punkte'}`:next?'Nächster Termin':'Alles erledigt',focus=action?`<div class=\"fc38-focus\"><small>ALS NÄCHSTES</small><b>${esc([action.time,action.title].filter(Boolean).join(' · '))}</b>${action.sub||action.left?`<span>${esc([action.left,action.sub].filter(Boolean).join(' · '))}</span>`:''}</div>`:'';return `<section class=\"fc38-priority\"><header><div><small>JETZT WICHTIG</small><h2>${esc(summary)}</h2></div>${count?`<button type=\"button\" data-open=\"homework\">Alle Aufgaben</button>`:''}</header>${focus}${rows.length?`<div class=\"fc38-priority-list\">${rows.join('')}</div>`:'<div class=\"fc38-clear\">Für heute ist nichts Dringendes mehr offen.</div>'}${count>4?`<button class=\"fc38-show-more\" type=\"button\" data-open=\"homework\">+ ${count-4} weitere offene ${count-4===1?'Aufgabe':'Aufgaben'}</button>`:''}</section>`}\n"""
          s=s[:start]+action+s[end:]
          start=s.index('function childrenAction(){');end=s.index('function todayPanel(){',start)
          children="""function childrenAction(){const date=todayIso(),kids=(D().people||[]).filter(p=>p.id!=='oli'),rows=[];for(const p of kids){let info={slots:[],items:[],special:[],notes:[]};try{info=schoolDayFor(p.id,date)}catch(_){}const status=window.__fcV9?.currentChildState?.(p,date,true),finished=info.slots?.length&&!status,prep=(typeof eventPreparationFor==='function'?eventPreparationFor(p.id,date):[]).filter(x=>{try{return !window.__fcV9?.eventIsPast?.(x.event)}catch(_){return true}}),schoolPack=finished?[]:[...(info.items||[]),...(info.special||[]),...(info.notes||[])];if(finished&&!prep.length)continue;const label=status?.label||(info.schoolBreak?.title||(!info.slots?.length?'Heute schulfrei':'Unterricht beendet')),prepHtml=prep.map(({event,text})=>`<strong class=\"fc38-event-preparation\" data-preparation-event=\"${esc(event.id)}\">${esc([event.title,eventTime(event),'Mitnehmen: '+text].filter(Boolean).join(' · '))}</strong>`).join('');rows.push(`<article class=\"fc38-child\" data-focus-child=\"${esc(p.id)}\">${avatar(p.id)}<div><b>${esc(p.name)}</b><span>${esc(label)}</span>${schoolPack.length?`<strong>${esc([...new Set(schoolPack)].join(' · '))}</strong>`:''}${prepHtml}</div></article>`)}if(rows.length)return `<section class=\"fc38-panel fc38-children\"><header><h2>Kinder im Blick</h2></header>${rows.join('')}</section>`;return `<section class=\"fc38-done-strip\"><span>✓</span><div><b>Kinder heute</b><small>Für heute keine Schul- oder Mitnehmen-Hinweise mehr offen.</small></div></section>`}\n"""
          s=s[:start]+children+s[end:]
          p.write_text(s)
          c=Path('family-command/reference-dashboard-v36.css');css=c.read_text()
          marker='#today .fc38-priority-list{display:block}'
          addition='''#today .fc38-focus{padding:11px 14px;border-bottom:1px solid #e4ebf4;background:#eef5ff}\n#today .fc38-focus small{display:block;font-size:9px;font-weight:850;letter-spacing:.09em;color:#52739a}\n#today .fc38-focus b{display:block;margin-top:3px;font-size:15px;line-height:1.25;color:#18314f}\n#today .fc38-focus span{display:block;margin-top:3px;font-size:10.5px;line-height:1.35;color:#607994}\n'''
          assert marker in css and '.fc38-focus{' not in css
          css=css.replace(marker,addition+marker,1);c.write_text(css)
          PY
          node --check family-command/reference-dashboard-v36.js
          node family-command/e2e/command-center-v974-source.spec.mjs
          git diff --check
          git add family-command/reference-dashboard-v36.js family-command/reference-dashboard-v36.css
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Show next departure and contextual child preparation'
          git push origin HEAD:refs/heads/feat/v974-command-center
