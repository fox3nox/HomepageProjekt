name: Family Command pro6 check
on:
  push:
    branches:
      - family-command-pro6-work
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check family-command/screen-redesign-v6.js
      - name: Check pro6 boot assets
        run: |
          grep -q "screen-redesign-v6.css" family-command/index.html
          grep -q "screen-redesign-v6.js" family-command/index.html
          grep -q "pro6-ok" family-command/index.html
          grep -q "family-command-v11" family-command/sw.js
