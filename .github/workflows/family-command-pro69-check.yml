name: Family Command pro6.9 check
on:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check family-command/daily-checklist.js
          node --check family-command/print-planner-v2.js
          node --check family-command/app-selftest-v6.js
          node --check family-command/sw.js
      - name: Boot wiring
        run: |
          grep -q "daily-checklist.js" family-command/index.html
          grep -q "print-planner-v2.js" family-command/index.html
          grep -q "pro6.9-ok" family-command/index.html
          grep -q "family-command-v19" family-command/sw.js
          grep -q "daily-checklist.js" family-command/sw.js
          grep -q "print-planner-v2.js" family-command/sw.js
          grep -q "pro6.9" family-command/build.txt
