name: HEAVY LIGHT V12 iPhone
on:
  push:
    paths:
      - 'heavy-light-v12-iphone/**'
      - 'heavy-light-v12/index.html'
      - 'heavy-light-v12/iphone.html'
      - '.github/workflows/hl12-iphone.yml'
  workflow_dispatch:
jobs:
  iphone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify camera fix and locked iPhone render surface
        run: |
          python3 -m http.server 8000 >/tmp/server.log 2>&1 &
          cat > iphone.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:932,height:430},isMobile:true,hasTouch:true,deviceScaleFactor:3});
          const errors=[];
          page.on('pageerror',e=>errors.push('page:'+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          await page.goto('http://127.0.0.1:8000/heavy-light-v12-iphone/?ci=camfix',{waitUntil:'load'});
          await page.waitForFunction(()=>{
            const s=window.__HL12_IPHONE__?.state?.();
            return s?.ready&&s?.inner?.game&&s.inner.cameraFix===true&&s.inner.appW===1280&&s.inner.appH===720&&s.inner.canvasCssW===1280&&s.inner.canvasCssH===720;
          });
          const frame=page.frameLocator('#game');
          await frame.locator('#start').click();
          await page.waitForFunction(()=>window.__HL12_IPHONE__?.state?.().inner?.game?.mode==='run');
          await page.waitForTimeout(180);

          const close=(a,b,t=2)=>Math.abs(a-b)<=t;
          async function snapshot(label){
            const s=await page.evaluate(()=>window.__HL12_IPHONE__.state());
            if(!s.ready)throw new Error(label+' NOT_READY '+JSON.stringify(s));
            if(!s.inner.cameraFix)throw new Error(label+' CAMERA_FIX_MISSING '+JSON.stringify(s.inner));
            if(s.inner.appW!==1280||s.inner.appH!==720)throw new Error(label+' APP_REFLOWED '+JSON.stringify(s.inner));
            if(s.inner.canvasCssW!==1280||s.inner.canvasCssH!==720)throw new Error(label+' CANVAS_CSS_REFLOWED '+JSON.stringify(s.inner));
            if(s.inner.canvasW!==2560||s.inner.canvasH!==1440)throw new Error(label+' CANVAS_BUFFER_CHANGED '+JSON.stringify(s.inner));
            if(s.inner.game?.mode!=='run')throw new Error(label+' GAME_NOT_RUNNING '+JSON.stringify(s.inner.game));
            return s;
          }

          const initial=await snapshot('INITIAL');
          if(!initial.locked)throw new Error('RUN_NOT_LOCKED '+JSON.stringify(initial));
          const anchor=initial.stage;

          await page.setViewportSize({width:844,height:390});
          await page.waitForTimeout(260);
          const compact=await snapshot('SAFARI_COMPACT');
          if(!compact.locked)throw new Error('COMPACT_UNLOCKED');
          if(!close(compact.stage.x,anchor.x)||!close(compact.stage.y,anchor.y)||!close(compact.stage.w,anchor.w)||!close(compact.stage.h,anchor.h))throw new Error('STAGE_JUMPED_COMPACT '+JSON.stringify({anchor,stage:compact.stage}));

          await page.setViewportSize({width:932,height:430});
          await page.waitForTimeout(260);
          const restored=await snapshot('RESTORED');
          if(!close(restored.stage.x,anchor.x)||!close(restored.stage.y,anchor.y)||!close(restored.stage.w,anchor.w)||!close(restored.stage.h,anchor.h))throw new Error('STAGE_JUMPED_RESTORED '+JSON.stringify({anchor,stage:restored.stage}));

          if(errors.length)throw new Error(errors.join('\n'));
          console.log('IPHONE_CAMERA_FIX_PASS '+JSON.stringify({initial,compact,restored}));
          await page.screenshot({path:'hl12-iphone-camera-fix-pass.png'});
          await browser.close();
          JS
          node iphone.mjs
