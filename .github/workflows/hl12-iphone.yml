name: HEAVY LIGHT V12 iPhone
on:
  push:
    paths:
      - 'heavy-light-v12-iphone/**'
      - '.github/workflows/hl12-iphone.yml'
  workflow_dispatch:
jobs:
  iphone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify fixed inner game viewport across Safari-style resize
        run: |
          python3 -m http.server 8000 >/tmp/server.log 2>&1 &
          cat > iphone.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:932,height:430},isMobile:true,hasTouch:true,deviceScaleFactor:3});
          const errors=[];
          page.on('pageerror',e=>errors.push('page:'+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          await page.goto('http://127.0.0.1:8000/heavy-light-v12-iphone/',{waitUntil:'load'});
          await page.waitForFunction(()=>window.__HL12_IPHONE__?.state().frameW===1280&&window.__HL12_IPHONE__?.state().frameH===720);
          const frame=page.frameLocator('#game');
          await frame.locator('#start').click();
          await page.waitForTimeout(250);
          async function verify(label){
            const outer=await page.evaluate(()=>window.__HL12_IPHONE__.state());
            const inner=await frame.locator('body').evaluate(()=>({w:innerWidth,h:innerHeight,state:window.__HL12__.state()}));
            if(inner.w!==1280||inner.h!==720)throw new Error(label+' INNER_VIEWPORT_CHANGED '+JSON.stringify(inner));
            if(inner.state.mode!=='run')throw new Error(label+' GAME_NOT_RUNNING '+JSON.stringify(inner.state));
            const {viewport:v,stage:r}=outer;
            const cx=r.x+r.w/2,cy=r.y+r.h/2;
            if(Math.abs(cx-(v.x+v.w/2))>3||Math.abs(cy-(v.y+v.h/2))>3)throw new Error(label+' STAGE_NOT_CENTERED '+JSON.stringify(outer));
            if(r.w>v.w+2||r.h>v.h+2)throw new Error(label+' STAGE_CLIPPED '+JSON.stringify(outer));
            return {outer,inner};
          }
          const initial=await verify('INITIAL');
          await page.setViewportSize({width:844,height:390});
          await page.waitForTimeout(260);
          const compact=await verify('SAFARI_COMPACT');
          await page.setViewportSize({width:932,height:430});
          await page.waitForTimeout(260);
          const restored=await verify('RESTORED');
          if(errors.length)throw new Error(errors.join('\n'));
          console.log('IPHONE_VIEWPORT_PASS '+JSON.stringify({initial,compact,restored}));
          await page.screenshot({path:'hl12-iphone-pass.png'});
          await browser.close();
          JS
          node iphone.mjs