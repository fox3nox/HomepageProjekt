name: Family Command dashboard redesign regression
on:
  pull_request:
    paths:
      - 'family-command/v9-professional.css'
      - 'family-command/e2e/dashboard-redesign.spec.mjs'
      - 'family-command/sw.js'
      - '.github/workflows/family-command-dashboard-redesign-check.yml'
  push:
    branches: [main]
    paths:
      - 'family-command/v9-professional.css'
      - 'family-command/e2e/dashboard-redesign.spec.mjs'
      - 'family-command/sw.js'
      - '.github/workflows/family-command-dashboard-redesign-check.yml'
jobs:
  dashboard-redesign:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright WebKit
        run: |
          npm install --no-save --package-lock=false playwright@1.57.0
      - name: Current responsive product contract
        run: |
          if grep -q "v11-app.js" family-command/index.html; then
            node --check family-command/v11-app.js
            node --check family-command/e2e/v11-product-shell.spec.mjs
            grep -q "fc11-sidebar" family-command/v11.css
          else
            node family-command/e2e/dashboard-redesign.spec.mjs
          fi
