name: HEAVY LIGHT V12 Level Tune
on:
  push:
    paths:
      - '.github/workflows/hl12-level-tune.yml'
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine pad and recovery sequences
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('heavy-light-v12/index.html')
          s=p.read_text()
          changes={
            "{t:'spike',x:B(16),w:58}":"{t:'spike',x:B(15),w:58}",
            "{t:'spike',x:B(16.7),w:58}":"{t:'spike',x:B(15.65),w:58}",
            "{t:'spike',x:B(32),w:58}":"{t:'spike',x:B(32.5),w:58}",
            "{t:'spike',x:B(32.7),w:58}":"{t:'spike',x:B(33.2),w:58}",
            "{t:'pad',x:B(50),w:92},":"",
          }
          for old,new in changes.items():
            if old not in s:
              raise SystemExit(f'Missing expected obstacle: {old}')
            s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Commit tuned level
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heavy-light-v12/index.html
          git commit -m 'Refine V12 pad and recovery sequences'
          git push