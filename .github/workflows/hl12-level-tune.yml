name: HEAVY LIGHT V12 Level Tune
on:
  push:
    paths:
      - '.github/workflows/hl12-level-tune.yml'
permissions:
  contents: write
jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tune block for human timing window
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('heavy-light-v12/index.html')
          s=p.read_text()
          old="{t:'block',x:B(22),y:470,w:120,h:130}"
          new="{t:'block',x:B(22),y:500,w:120,h:100}"
          if old not in s:
            raise SystemExit('Expected block geometry not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit tuned level
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add heavy-light-v12/index.html
          git commit -m 'Tune V12 block for human timing window'
          git push