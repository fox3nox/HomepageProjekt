name: HEAVY LIGHT V16 iPhone
on:
  push:
    paths:
      - 'heavy-light-v16/**'
      - '.github/workflows/hl16-iphone.yml'
  workflow_dispatch:
jobs:
  iphone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify V16 camera, physics input and iPhone viewport lock
        run: |
          python3 -m http.server 8000 >/tmp/server.log 2>&1 &
          cat > v16.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:932,height:430},isMobile:true,hasTouch:true,deviceScaleFactor:3});
          const errors=[];
          page.on('pageerror',e=>errors.push('page:'+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          await page.goto('http://127.0.0.1:8000/heavy-light-v16/',{waitUntil:'load'});
          await page.waitForFunction(()=>window.__HL16__?.state?.().mode==='menu');
          if(!(await page.locator('#startBtn').isVisible()))throw new Error('START_NOT_VISIBLE');
          await page.locator('#startBtn').click();
          await page.waitForFunction(()=>window.__HL16__?.state?.().mode==='run');
          const a=await page.evaluate(()=>window.__HL16__.state());
          await page.waitForTimeout(850);
          const b=await page.evaluate(()=>window.__HL16__.state());
          if(!(b.x>a.x+250))throw new Error('RUNNER_TOO_SLOW '+JSON.stringify({a,b}));
          if(!(b.cam>40))throw new Error('CAMERA_NOT_FOLLOWING '+JSON.stringify(b));
          const screenX=b.x-b.cam;
          if(screenX<180||screenX>520)throw new Error('RUNNER_SCREEN_POSITION_BAD '+JSON.stringify({screenX,b}));
          await page.evaluate(()=>window.__HL16__.input(true));
          await page.waitForTimeout(50);
          await page.evaluate(()=>window.__HL16__.input(false));
          await page.waitForTimeout(180);
          const j=await page.evaluate(()=>window.__HL16__.state());
          if(!(j.y<548&&j.vy<0))throw new Error('RELEASE_JUMP_FAILED '+JSON.stringify(j));
          if(!j.view.locked)throw new Error('VIEW_NOT_LOCKED');
          const locked={w:j.view.w,h:j.view.h};
          await page.setViewportSize({width:844,height:390});
          await page.waitForTimeout(180);
          const r=await page.evaluate(()=>window.__HL16__.state());
          if(r.view.w!==locked.w||r.view.h!==locked.h)throw new Error('VIEWPORT_DRIFT '+JSON.stringify({locked,after:r.view}));
          if(r.mode!=='run')throw new Error('RUN_INTERRUPTED');
          if(errors.length)throw new Error(errors.join('\n'));
          console.log('HL16_PASS '+JSON.stringify(r));
          await browser.close();
          JS
          node v16.mjs
