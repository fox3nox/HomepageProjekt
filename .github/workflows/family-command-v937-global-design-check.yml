name: Family Command V9.44 global design regression
on:
  push:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-v937-global-design-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-v937-global-design-check.yml'
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit
      - run: node family-command/e2e/global-design-v37.spec.mjs
      - name: Upload V9.44 mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: family-command-v944-mobile-screens
          path: family-command/e2e-artifacts/v944-*.png
          if-no-files-found: warn
