name: Family Command V9.37 global design regression
on:
  push:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-v937-global-design-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-v937-global-design-check.yml'
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps webkit
      - run: node family-command/e2e/global-design-v37.spec.mjs
