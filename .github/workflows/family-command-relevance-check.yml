name: Family Command relevance check
on:
  push:
    branches: [family-command-pro65-relevance]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check family-command/today-relevance.js
          node --check family-command/app-selftest-v6.js
          node --check family-command/sw.js
      - name: Relevance asset cached
        run: |
          grep -q "today-relevance.js" family-command/sw.js
          grep -q "today-relevance.js" family-command/app-selftest-v6.js
