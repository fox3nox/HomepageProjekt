name: Family Command full interaction audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-full-interaction-audit.yml'
  push:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-full-interaction-audit.yml'
permissions:
  contents: read
concurrency:
  group: family-command-full-interaction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  interaction-audit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright package
        timeout-minutes: 2
        run: npm install --no-save --package-lock=false playwright@1.57.0
      - name: Full mobile interaction audit
        run: node family-command/e2e/full-interaction-audit.spec.mjs
