name: Family Command full interaction audit
on:
  pull_request:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-full-interaction-audit.yml'
  push:
    branches: [main]
    paths:
      - 'family-command/**'
      - '.github/workflows/family-command-full-interaction-audit.yml'
permissions:
  contents: read
concurrency:
  group: family-command-full-interaction-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  interaction-audit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check family-command/family-contacts.js
          node --check family-command/v11-app.js
          node --check family-command/e2e/family-contacts-stability.spec.mjs
          node --check family-command/e2e/v11-product-shell.spec.mjs
          node --check family-command/e2e/full-interaction-audit.spec.mjs
      - name: Install matching Playwright package
        timeout-minutes: 2
        run: npm install --no-save --package-lock=false playwright@1.57.0
      - name: Contact routing and mutation stability
        run: node family-command/e2e/family-contacts-stability.spec.mjs
      - name: Current product interaction audit
        run: |
          if grep -q "v11-app.js" family-command/index.html; then
            FC_BROWSER=webkit node family-command/e2e/v11-product-shell.spec.mjs
          else
            node family-command/e2e/full-interaction-audit.spec.mjs
            node family-command/e2e/unified-experience.spec.mjs
          fi
