name: Family Command V9.47 mobile school day regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'family-command/mobile-school-day-v947.js'
      - 'family-command/mobile-school-day-v947.css'
      - 'family-command/reference-mobile-v35.js'
      - 'family-command/sw.js'
      - 'family-command/e2e/mobile-school-day-v947.spec.mjs'
      - '.github/workflows/family-command-mobile-school-day-v947-check.yml'
  push:
    branches: [main]
    paths:
      - 'family-command/mobile-school-day-v947.js'
      - 'family-command/mobile-school-day-v947.css'
      - 'family-command/reference-mobile-v35.js'
      - 'family-command/sw.js'
      - 'family-command/e2e/mobile-school-day-v947.spec.mjs'
      - '.github/workflows/family-command-mobile-school-day-v947-check.yml'
jobs:
  mobile-school-day:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check family-command/mobile-school-day-v947.js
          node --check family-command/reference-mobile-v35.js
          node --check family-command/e2e/mobile-school-day-v947.spec.mjs
          grep -q "mobile-school-day-v947.css" family-command/reference-mobile-v35.js
          grep -q "mobile-school-day-v947.js" family-command/reference-mobile-v35.js
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: iPhone and desktop regression
        run: node family-command/e2e/mobile-school-day-v947.spec.mjs
