name: Family Command V9.52 mobile polish regression
on:
  push:
    branches: [main]
    paths:
      - 'family-command/v9-mobile-polish-v952.css'
      - 'family-command/header-native-v9652.css'
      - 'family-command/header-structure-v9654.css'
      - 'family-command/header-crisp-v9654.css'
      - 'family-command/header-structure-v9654.js'
      - 'family-command/reference-mobile-v35.js'
      - 'family-command/reference-dashboard-v36.js'
      - 'family-command/sw.js'
      - 'family-command/e2e/mobile-polish-v952.spec.mjs'
      - 'family-command/e2e/header-crisp-v9654.spec.mjs'
      - '.github/workflows/family-command-mobile-polish-v952-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/v9-mobile-polish-v952.css'
      - 'family-command/header-native-v9652.css'
      - 'family-command/header-structure-v9654.css'
      - 'family-command/header-crisp-v9654.css'
      - 'family-command/header-structure-v9654.js'
      - 'family-command/reference-mobile-v35.js'
      - 'family-command/reference-dashboard-v36.js'
      - 'family-command/sw.js'
      - 'family-command/e2e/mobile-polish-v952.spec.mjs'
      - 'family-command/e2e/header-crisp-v9654.spec.mjs'
      - '.github/workflows/family-command-mobile-polish-v952-check.yml'
jobs:
  mobile-polish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax integration
        run: |
          node --check family-command/reference-mobile-v35.js
          node --check family-command/header-structure-v9654.js
          node --check family-command/reference-dashboard-v36.js
          node --check family-command/e2e/mobile-polish-v952.spec.mjs
          grep -q "v9-mobile-polish-v952.css" family-command/reference-mobile-v35.js
          grep -q "header-structure-v9654.css" family-command/reference-mobile-v35.js
          grep -q "family-command-v89" family-command/sw.js
      - name: Header crisp contract
        run: node family-command/e2e/header-crisp-v9654.spec.mjs
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: iPhone mobile polish regression
        run: node family-command/e2e/mobile-polish-v952.spec.mjs
