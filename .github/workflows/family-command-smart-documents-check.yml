name: Family Command smart documents regression
on:
  push:
    branches: [main]
    paths:
      - 'family-command/index.html'
      - 'family-command/smart-documents.js'
      - 'family-command/document-viewer.js'
      - 'family-command/sw.js'
      - 'family-command/e2e/smart-documents.spec.mjs'
      - '.github/workflows/family-command-smart-documents-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/index.html'
      - 'family-command/smart-documents.js'
      - 'family-command/document-viewer.js'
      - 'family-command/sw.js'
      - 'family-command/e2e/smart-documents.spec.mjs'
      - '.github/workflows/family-command-smart-documents-check.yml'
jobs:
  smart-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and boot integration
        run: |
          node --check family-command/smart-documents.js
          node --check family-command/document-viewer.js
          node --check family-command/e2e/smart-documents.spec.mjs
          grep -q "smart-documents.js" family-command/index.html
          grep -q "__fcSmartDocumentsHealth" family-command/smart-documents.js
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install WebKit
        run: npx playwright install --with-deps webkit
      - name: iPhone smart documents regression
        id: smarttest
        shell: bash
        run: |
          set -o pipefail
          node family-command/e2e/smart-documents.spec.mjs 2>&1 | tee smart-documents-test.log
      - name: Upload smart documents diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smart-documents-diagnostics
          path: smart-documents-test.log
          if-no-files-found: error
