name: HEAVY LIGHT V12 Check
on:
  push:
    paths:
      - 'heavy-light-v12/**'
      - '.github/workflows/hl12-check.yml'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract inline game script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('heavy-light-v12/index.html').read_text()
          scripts=re.findall(r'<script>([\s\S]*?)</script>',s)
          assert scripts, 'No inline game script found'
          Path('/tmp/hl12.js').write_text('\n'.join(scripts))
          PY
      - name: Check JavaScript syntax and fixed hitbox hooks
        run: |
          node --check /tmp/hl12.js
          grep -q '__HL12__' heavy-light-v12/index.html
          grep -q 'pointerdown' heavy-light-v12/index.html
          grep -q 'FIX=1/120' heavy-light-v12/index.html
          grep -q 'HALF=22' heavy-light-v12/index.html
          grep -q 'Math.round(p.angle/(Math.PI/2))' heavy-light-v12/index.html
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null
      - name: Run iPhone landscape gameplay smoke test
        run: |
          python3 -m http.server 8000 >/tmp/hl12-server.log 2>&1 &
          cat > smoke.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:932,height:430},isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push('page:'+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          await page.goto('http://127.0.0.1:8000/heavy-light-v12/',{waitUntil:'load'});
          await page.waitForFunction(()=>window.__HL12__);
          if(!(await page.locator('#menu').isVisible())) throw new Error('menu not visible');
          await page.click('#start');
          await page.waitForTimeout(60);
          let s=await page.evaluate(()=>window.__HL12__.state());
          if(s.mode!=='run') throw new Error('run did not start');
          await page.dispatchEvent('#game','pointerdown',{pointerType:'touch',isPrimary:true});
          await page.waitForTimeout(20);
          s=await page.evaluate(()=>window.__HL12__.state());
          if(!s.heavy) throw new Error('pointerdown did not enter HEAVY');
          await page.dispatchEvent('#game','pointerup',{pointerType:'touch',isPrimary:true});
          await page.waitForTimeout(70);
          s=await page.evaluate(()=>window.__HL12__.state());
          if(s.heavy) throw new Error('pointerup did not return LIGHT');
          if(!(s.vy<0&&s.y<578&&!s.ground)) throw new Error('release did not create deterministic ground jump');
          await page.dispatchEvent('#game','pointerdown',{pointerType:'touch',isPrimary:true});
          const slam=await page.evaluate(()=>window.__HL12__.state());
          if(!slam.heavy||slam.ground||slam.vy<700) throw new Error('HEAVY slam not immediate/decisive in air');
          await page.dispatchEvent('#game','pointerup',{pointerType:'touch',isPrimary:true});
          const airRelease=await page.evaluate(()=>window.__HL12__.state());
          if(airRelease.heavy||airRelease.ground||airRelease.vy<0) throw new Error('air release created unwanted second jump');
          await page.reload({waitUntil:'load'});
          await page.waitForFunction(()=>window.__HL12__);
          await page.click('#start');
          await page.waitForTimeout(2300);
          const retry=await page.evaluate(()=>window.__HL12__.state());
          if(retry.attempt<2) throw new Error('crash/retry loop did not advance attempt');
          if(errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          console.log(JSON.stringify({ok:true,attempt:retry.attempt,airReleaseVy:airRelease.vy}));
          JS
          node smoke.mjs
      - name: Complete FRACTURE track with deterministic controller
        run: |
          python3 -m http.server 8001 >/tmp/hl12-track-server.log 2>&1 &
          cat > track.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:932,height:430},isMobile:true,hasTouch:true});
          const errors=[];
          page.on('pageerror',e=>errors.push('page:'+e.message));
          page.on('console',m=>{if(m.type()==='error')errors.push('console:'+m.text())});
          await page.goto('http://127.0.0.1:8001/heavy-light-v12/',{waitUntil:'load'});
          await page.waitForFunction(()=>window.__HL12__);
          await page.click('#start');
          await page.evaluate(()=>{
            const api=window.__HL12__,BPX=605*60/158,B=n=>300+n*BPX;
            const impacts=[B(8),B(26),B(41),B(54)];
            const phases=[B(10),B(24),B(35),B(48)];
            const jumps=[
              {x:B(3),lead:130},{x:B(5),lead:120},{x:B(16),lead:120},{x:B(18),lead:120},
              {x:B(22),lead:120},{x:B(30.3),lead:135},{x:B(32),lead:120},{x:B(45),lead:120},
              {x:B(52),lead:65,type:'pit'},{x:B(12),lead:65,type:'pit'},{x:B(28),lead:65,type:'pit'},{x:B(39),lead:65,type:'pit'}
            ].sort((a,b)=>a.x-b.x);
            let lastJump=-999;
            window.__hl12bot=setInterval(()=>{
              const s=api.state();if(s.mode!=='run')return;const x=s.x;
              const wall=impacts.find(v=>x>v-175&&x<v+82);
              if(wall){api.setHeavy(true);return;}
              const phase=phases.find(v=>x>v-165&&x<v+105);
              if(phase){api.setHeavy(false);return;}
              if(s.ground){
                const h=jumps.find(v=>x>v.x-v.lead&&x<v.x-18&&Math.abs(v.x-lastJump)>70);
                if(h){if(s.heavy)api.setHeavy(false);else{api.setHeavy(true);api.setHeavy(false)}lastJump=h.x;return;}
              }
            },6);
          });
          await page.waitForFunction(()=>window.__HL12__.state().mode==='result',{timeout:30000});
          const end=await page.evaluate(()=>window.__HL12__.state());
          if(end.attempt!==1) throw new Error('track required retry; attempt='+end.attempt+' x='+end.x);
          if(errors.length) throw new Error(errors.join('\n'));
          await page.screenshot({path:'hl12-track-complete.png'});
          await browser.close();
          console.log(JSON.stringify({ok:true,time:end.time,score:end.score,attempt:end.attempt,x:end.x}));
          JS
          node track.mjs