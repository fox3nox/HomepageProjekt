name: Family Command V9.62.1 loader dedupe regression
on:
  push:
    branches: [main]
    paths:
      - 'family-command/reference-mobile-v35.js'
      - 'family-command/sharp-header-v9643.css'
      - 'family-command/e2e/reference-loader-dedupe-v9621.spec.mjs'
      - 'family-command/e2e/sharp-header-v9645.spec.mjs'
      - '.github/workflows/family-command-v9621-loader-dedupe-check.yml'
  pull_request:
    branches: [main]
    paths:
      - 'family-command/reference-mobile-v35.js'
      - 'family-command/sharp-header-v9643.css'
      - 'family-command/e2e/reference-loader-dedupe-v9621.spec.mjs'
      - 'family-command/e2e/sharp-header-v9645.spec.mjs'
      - '.github/workflows/family-command-v9621-loader-dedupe-check.yml'
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: |
          node --check family-command/reference-mobile-v35.js
          node --check family-command/e2e/reference-loader-dedupe-v9621.spec.mjs
          node --check family-command/e2e/sharp-header-v9645.spec.mjs
      - name: Loader dedupe and cascade order
        run: node family-command/e2e/reference-loader-dedupe-v9621.spec.mjs
      - name: Native iOS header rendering
        run: node family-command/e2e/sharp-header-v9645.spec.mjs
