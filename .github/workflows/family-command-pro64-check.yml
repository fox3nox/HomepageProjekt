name: Family Command pro6.4 check
on:
  push:
    branches: [family-command-stability-pro64]
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: |
          node --check family-command/app-data-rules.js
          node --check family-command/backup-manager.js
          node --check family-command/app-selftest-v6.js
          node --check family-command/smoke-tests.js
      - name: Boot assets exist
        run: |
          test -f family-command/index.html
          test -f family-command/app-data-rules.js
          test -f family-command/backup-manager.js
          test -f family-command/app-selftest-v6.js
          test -f family-command/smoke-tests.js
          grep -q "app-data-rules.js" family-command/index.html
          grep -q "backup-manager.js" family-command/index.html
          grep -q "smoke-tests.js" family-command/index.html
          grep -q "pro6.4-ok" family-command/index.html
