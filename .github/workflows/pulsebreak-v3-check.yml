name: Pulsebreak V3 Mobile QA

on:
  push:
    paths:
      - 'pulsebreak-v3/**'
      - '.github/workflows/pulsebreak-v3-check.yml'
  workflow_dispatch:

concurrency:
  group: pulsebreak-v3-live-qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read expected build
        run: |
          BUILD=$(grep -o 'name="pulsebreak-build" content="[^"]*"' pulsebreak-v3/index.html | sed -E 's/.*content="([^"]*)"/\1/')
          echo "EXPECTED_BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "Expected live build: $BUILD"
      - name: Syntax check local game scripts
        run: |
          node --check pulsebreak-v3/level.js
          node --check pulsebreak-v3/art.js
          node --check pulsebreak-v3/play.js
          node --check pulsebreak-v3/gd-physics.js
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 --no-save
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test live Pulsebreak mobile flow
        env:
          BROWSER_NAME: ${{ matrix.browser }}
        run: |
          node <<'NODE'
          const playwright = require('playwright');
          const assert = require('assert');
          const browserName = process.env.BROWSER_NAME;
          const expectedBuild = process.env.EXPECTED_BUILD;
          const browserType = playwright[browserName];
          const baseUrl = 'https://fox3nox.github.io/HomepageProjekt/pulsebreak-v3/';
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          const near=(a,b,t,msg)=>assert(Math.abs(a-b)<=t,`${msg}: got ${a}, expected ${b} ±${t}`);

          (async()=>{
            let liveBuild='';
            for(let i=0;i<30;i++){
              try{
                const text=await (await fetch(baseUrl+'?deployProbe='+Date.now(),{cache:'no-store'})).text();
                const m=text.match(/name="pulsebreak-build" content="([^"]+)"/);
                liveBuild=m?m[1]:'';
                console.log('LIVE_BUILD',liveBuild,'attempt',i+1);
                if(liveBuild===expectedBuild) break;
              }catch(e){console.log('DEPLOY_PROBE_ERROR',e.message)}
              await sleep(4000);
            }
            assert.strictEqual(liveBuild,expectedBuild,`GitHub Pages never reached ${expectedBuild}; live=${liveBuild}`);

            const browser=await browserType.launch({headless:true});
            const context=await browser.newContext({viewport:{width:852,height:393},screen:{width:852,height:393},deviceScaleFactor:2,isMobile:true,hasTouch:true,serviceWorkers:'block'});
            const page=await context.newPage();
            const errors=[];const failed=[];
            page.on('pageerror',e=>{errors.push('pageerror: '+e.message);console.log('PAGEERROR',e.message)});
            page.on('console',m=>{console.log('BROWSER',m.type(),m.text());if(m.type()==='error')errors.push('console: '+m.text())});
            page.on('requestfailed',r=>{failed.push(r.url()+' :: '+(r.failure()?.errorText||''));console.log('REQUESTFAILED',failed.at(-1))});

            const response=await page.goto(baseUrl+'?qa='+Date.now(),{waitUntil:'networkidle',timeout:45000});
            assert(response&&response.ok(),'live page did not return 2xx');
            await page.waitForFunction(()=>window.pulsebreakScene&&window.PULSEBREAK_PHYSICS,{timeout:10000});

            const boot=await page.evaluate(()=>({
              build:document.querySelector('meta[name="pulsebreak-build"]')?.content,
              phaser:typeof window.Phaser,
              scene:!!window.pulsebreakScene,
              canvas:!!document.querySelector('#game canvas'),
              bootError:document.querySelector('#boot-error')?.classList.contains('visible'),
              physics:window.PULSEBREAK_PHYSICS.selfTest()
            }));
            console.log('BOOT_STATE',JSON.stringify(boot));
            assert.strictEqual(boot.build,expectedBuild,'wrong live build');
            assert(boot.phaser==='object'&&boot.scene&&boot.canvas,'scene/canvas did not boot');
            assert(!boot.bootError,'boot error panel is visible');
            assert(boot.physics.pass,'physics self-test failed: '+JSON.stringify(boot.physics));
            near(boot.physics.normalSpeedBlocksPerSecond,10.385991096496582,.00001,'normal speed');
            near(boot.physics.normalJump.apexBlocks,2.1333,.02,'normal cube apex');
            near(boot.physics.heldJump.apexBlocks,2.233,.02,'held cube apex');

            const canvasBox=await page.locator('#game canvas').boundingBox();
            assert(canvasBox,'canvas has no bounds');
            near(canvasBox.x,0,2,'canvas x');near(canvasBox.y,0,2,'canvas y');near(canvasBox.width,852,3,'canvas width');near(canvasBox.height,393,3,'canvas height');
            const view=await page.evaluate(()=>window.pulsebreakViewport);
            console.log('VIEWPORT',JSON.stringify(view));
            assert(view&&Math.abs(view.cameraOriginX)<.001&&Math.abs(view.cameraOriginY)<.001,'camera origin is not top-left');

            assert(await page.locator('#start-btn').isVisible(),'start button not visible');
            await page.screenshot({path:`pulsebreak-${browserName}-menu.png`,fullPage:true});
            await page.locator('#start-btn').click();
            await page.waitForFunction(()=>window.pulsebreakScene?.started===true,{timeout:5000});
            await page.waitForTimeout(300);

            const before=await page.evaluate(()=>({x:pulsebreakScene.player.x,y:pulsebreakScene.player.y,w:pulsebreakScene.player.w,h:pulsebreakScene.player.h,vx:pulsebreakScene.player.vx,attempt:pulsebreakScene.attempt}));
            assert(before.x>320,'auto-run did not move player');
            near(before.w,42,.01,'cube hazard body width');near(before.h,42,.01,'cube hazard body height');
            near(before.vx,10.385991096496582*42,.02,'runtime normal speed');
            const rotationLeak=await page.evaluate(()=>('rotation' in pulsebreakScene.player)||('angle' in pulsebreakScene.player));
            assert(!rotationLeak,'visual rotation leaked into physics body');

            await page.touchscreen.tap(426,250);
            await page.waitForTimeout(55);
            const jump=await page.evaluate(()=>({vy:pulsebreakScene.player.vy,onGround:pulsebreakScene.player.onGround}));
            assert(jump.vy<0&&!jump.onGround,'touch did not trigger cube jump');

            const modes=await page.evaluate(()=>{
              const s=pulsebreakScene;s.setPaused(true);const result=[];
              LEVEL.portals.forEach(p=>p.used=false);
              for(const v of s.portalVisual){const po=v.data;s.player.x=po.x+2;s.player.y=po.y+Math.min(120,po.h/2);s.checkPortals();result.push({mode:s.player.mode,w:s.player.w,h:s.player.h});}
              return result;
            });
            console.log('MODE_DATA',JSON.stringify(modes));
            assert.deepStrictEqual(modes.map(x=>x.mode),['wave','ball','cube'],'portal mode sequence failed');
            near(modes[0].w,14,.05,'wave body width');near(modes[1].w,42,.05,'ball body width');near(modes[2].w,42,.05,'cube body width after portal');

            const wave=await page.evaluate(()=>{
              const s=pulsebreakScene;s.resetPlayer(false);s.started=true;s.setPaused(false);s.player.mode=MODES.WAVE;s.setModeBody(MODES.WAVE);s.player.x=400;s.player.y=300;s.actionHeld=true;s.fixedStep(FIXED);return {vx:s.player.vx,vy:s.player.vy,ratio:Math.abs(s.player.vy/s.player.vx)};
            });
            near(wave.ratio,1,.0001,'wave trajectory');

            const ball=await page.evaluate(()=>{
              const s=pulsebreakScene;s.resetPlayer(false);s.started=true;s.player.mode=MODES.BALL;s.setModeBody(MODES.BALL);
              const g0=s.player.gravity;s.player.onGround=false;s.actionPress();const air=s.player.gravity;s.player.onGround=true;s.actionPress();const ground=s.player.gravity;return {g0,air,ground};
            });
            assert.strictEqual(ball.air,ball.g0,'ball flipped gravity in mid-air');
            assert.strictEqual(ball.ground,-ball.g0,'ball did not flip gravity on surface');

            await page.evaluate(()=>{pulsebreakScene.resetPlayer(false);pulsebreakScene.started=true;});
            const attemptBefore=await page.evaluate(()=>pulsebreakScene.attempt);
            await page.evaluate(()=>pulsebreakScene.kill());
            await page.waitForTimeout(650);
            const afterDeath=await page.evaluate(()=>({attempt:pulsebreakScene.attempt,dead:pulsebreakScene.dead,visible:pulsebreakScene.playerSprite.visible,mode:pulsebreakScene.player.mode,x:pulsebreakScene.player.x}));
            assert(afterDeath.attempt===attemptBefore+1,'death did not increment attempt');
            assert(!afterDeath.dead&&afterDeath.visible,'respawn did not recover');
            assert(afterDeath.mode==='cube'&&afterDeath.x>=320,'respawn state invalid');

            await page.screenshot({path:`pulsebreak-${browserName}-playing.png`,fullPage:true});
            if(failed.length)throw new Error('failed requests:\n'+failed.join('\n'));
            if(errors.length)throw new Error(errors.join('\n'));
            console.log('PULSEBREAK MOBILE QA PASS',JSON.stringify({browserName,expectedBuild,before,jump,modes,wave,ball,afterDeath,view}));
            await browser.close();
          })().catch(e=>{console.error('QA_FAILURE',e);process.exit(1)});
          NODE
      - name: Upload mobile screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsebreak-${{ matrix.browser }}-${{ env.EXPECTED_BUILD }}
          path: pulsebreak-${{ matrix.browser }}-*.png
          if-no-files-found: ignore
          retention-days: 2
