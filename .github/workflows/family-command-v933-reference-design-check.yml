name: Family Command legacy V9.33 design archive
on:
  pull_request:
    branches: [main]
    paths:
      - 'family-command/reference-dashboard-v36.css'
      - 'family-command/reference-dashboard-v36.js'
      - 'family-command/e2e/reference-design.spec.mjs'
      - '.github/workflows/family-command-v933-reference-design-check.yml'
  push:
    branches: [main]
    paths:
      - 'family-command/reference-dashboard-v36.css'
      - 'family-command/reference-dashboard-v36.js'
      - 'family-command/e2e/reference-design.spec.mjs'
      - '.github/workflows/family-command-v933-reference-design-check.yml'

permissions:
  contents: read

jobs:
  archived-design-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Legacy contract is retained only for archived V9 assets
        run: |
          set -euo pipefail
          test -f family-command/v11-app.js
          test -f family-command/v11.css
          grep -q "v11-app.js" family-command/index.html
          echo "V9 visual contract archived; V11 visual QA runs in family-command-v11-check.yml."
