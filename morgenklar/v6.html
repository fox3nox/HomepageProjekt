<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MorgenKlar V6</title></head><body><script>
fetch('./index.html?base=v5').then(r=>r.text()).then(html=>{
  const scripts=['app1.js','app2.js','app3.js','app4.js','app5.js','app6a.js','app6b.js','app6c.js'].map(x=>'<scr'+'ipt src="./'+x+'"></scr'+'ipt>').join('');
  html=html.replace(/<script src="\/app\.js"><\/script>/,scripts);
  html=html.replaceAll('href="/manifest.webmanifest"','href="./manifest.webmanifest"');
  document.open();document.write(html);document.close();
}).catch(()=>{document.body.innerHTML='<p style="font-family:system-ui;padding:24px">MorgenKlar konnte nicht geladen werden.</p>'});
</script></body></html>
