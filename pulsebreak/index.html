<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050711"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>PULSEBREAK 1.5</title><style>html,body{margin:0;width:100%;height:100%;background:#050711;color:#fff;font-family:system-ui,sans-serif}body{display:grid;place-items:center}#boot{opacity:.72;letter-spacing:.12em;font-size:12px}</style></head><body><div id="boot">PULSEBREAK 1.5 · LOADING</div><script>(async()=>{try{if(typeof DecompressionStream!=="function")throw new Error("Dieser Browser unterstützt den benötigten GZIP-Loader nicht.");const r=await fetch("./v15.gz?v=15",{cache:"no-store"});if(!r.ok)throw new Error("v15.gz HTTP "+r.status);const stream=r.body.pipeThrough(new DecompressionStream("gzip"));const html=await new Response(stream).text();document.open();document.write(html);document.close();}catch(e){document.body.innerHTML='<main style="padding:24px;max-width:640px"><h1>PULSEBREAK</h1><p>Das Spiel konnte nicht geladen werden.</p><pre style="white-space:pre-wrap">'+String(e.message||e)+'</pre></main>';}})();</script></body></html>
