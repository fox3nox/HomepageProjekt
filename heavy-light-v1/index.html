<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<meta name="theme-color" content="#06080f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>HEAVY / LIGHT — Prototype</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<main id="app">
  <canvas id="game" aria-label="Heavy Light Spiel"></canvas>
  <header id="hud">
    <div class="brand"><b>HEAVY</b><span>/</span><strong>LIGHT</strong></div>
    <div class="progress"><div id="progressFill"></div></div>
    <button id="restart" aria-label="Neu starten">↻</button>
  </header>
  <div id="modeBadge" class="mode light"><span class="dot"></span><b>LIGHT</b><small>LOS LASSEN</small></div>
  <section id="intro" class="overlay">
    <div class="introCard">
      <h1><b>HEAVY</b><span>/</span><strong>LIGHT</strong></h1>
      <p>Eine Kugel. Eine Berührung. Zwei Physiken.</p>
      <div class="rules">
        <div><i class="heavyOrb"></i><span><b>HALTEN</b><small>schwer · fällt · zerbricht</small></span></div>
        <div><i class="lightOrb"></i><span><b>LOSLASSEN</b><small>leicht · schwebt · springt</small></span></div>
      </div>
      <button id="play">SPIELEN</button>
    </div>
  </section>
  <section id="result" class="overlay hidden">
    <div class="resultCard">
      <small>RUN COMPLETE</small>
      <h2 id="resultTitle">SAUBER!</h2>
      <div class="score" id="score">0</div>
      <p id="resultText">Perfekte Wechsel halten deine Combo am Leben.</p>
      <button id="again">NOCH EINE RUNDE</button>
    </div>
  </section>
  <div id="rotate" class="rotate hidden"><div>↻<b>iPhone quer drehen</b><span>HEAVY / LIGHT ist für Querformat gebaut.</span></div></div>
</main>
<script src="engine.js"></script>
<script src="render.js"></script>
</body>
</html>
