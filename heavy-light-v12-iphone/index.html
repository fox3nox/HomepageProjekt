<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#020409">
<title>HEAVY / LIGHT V12 — iPhone</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020409;touch-action:none;overscroll-behavior:none}
body{position:fixed;inset:0}
#shell{position:fixed;inset:0;overflow:hidden;background:#020409}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;will-change:transform;contain:layout paint size;background:#05070c;box-shadow:0 0 0 1px rgba(255,255,255,.035)}
iframe{display:block;width:1280px;height:720px;border:0;background:#05070c;overflow:hidden}
#rotate{display:none;position:fixed;z-index:20;inset:0;place-items:center;text-align:center;padding:36px;color:#fff;background:#020409;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
#rotate b{display:block;font-size:24px}#rotate span{display:block;margin-top:8px;color:#8491a7}
@media(orientation:portrait){#rotate{display:grid}}
</style>
</head>
<body>
<div id="shell">
  <div id="stage"><iframe id="game" title="HEAVY / LIGHT V12" width="1280" height="720" allow="autoplay" scrolling="no"></iframe></div>
</div>
<div id="rotate"><div><b>iPhone drehen</b><span>Querformat für HEAVY / LIGHT.</span></div></div>
<script>
(()=>{
  'use strict';
  const GAME_W=1280,GAME_H=720,PAD=6,GAME_URL='../heavy-light-v12/index.html';
  const stage=document.getElementById('stage');
  const frame=document.getElementById('game');
  let raf=0,lastKey='',locked=false,ready=false;

  function viewport(){
    const vv=window.visualViewport;
    return {
      w:Math.max(1,vv?.width||document.documentElement.clientWidth||innerWidth),
      h:Math.max(1,vv?.height||document.documentElement.clientHeight||innerHeight),
      x:vv?.offsetLeft||0,
      y:vv?.offsetTop||0
    };
  }

  function layout(force=false){
    raf=0;
    if(locked&&!force)return;
    const v=viewport();
    const s=Math.max(.1,Math.min((v.w-PAD*2)/GAME_W,(v.h-PAD*2)/GAME_H));
    const x=v.x+(v.w-GAME_W*s)/2;
    const y=v.y+(v.h-GAME_H*s)/2;
    const key=[v.w.toFixed(2),v.h.toFixed(2),v.x.toFixed(2),v.y.toFixed(2),s.toFixed(5)].join('|');
    if(!force&&key===lastKey)return;
    lastKey=key;
    stage.style.transform=`translate3d(${x}px,${y}px,0) scale(${s})`;
  }

  function schedule(force=false){
    if(locked&&!force)return;
    if(!raf)raf=requestAnimationFrame(()=>layout(force));
  }
  function freeze(){layout(true);locked=true}
  function unfreeze(){locked=false;schedule(true)}

  function patchGame(html){
    const resizeNeedle="let dpr=1,sc=1,vw=W;function resize(){dpr=Math.min(2,devicePixelRatio||1);cv.width=Math.floor(innerWidth*dpr);cv.height=Math.floor(innerHeight*dpr);sc=cv.height/H;vw=cv.width/sc}addEventListener('resize',resize,{passive:true});resize();";
    const resizeFixed="let dpr=1,sc=1,vw=W;function resize(){dpr=Math.min(2,devicePixelRatio||1);cv.width=Math.floor(W*dpr);cv.height=Math.floor(H*dpr);sc=dpr;vw=W}resize();";
    const cameraNeedle="camY=lerp(cam,clamp((p.y-430)*.08,-18,26),.09)";
    const cameraFixed="camY=lerp(camY,clamp((p.y-430)*.08,-18,26),.09)";
    const resetNeedle="dead=shake=punch=flash=pulse=hit=0;palette=0;input=false;releaseBuffer=0;coyote=.08;particles=[];rings=[];trails=[];shards=[];hud()";
    const resetFixed="dead=shake=punch=flash=pulse=hit=0;palette=0;input=false;releaseBuffer=0;coyote=.08;cam=0;camY=0;zoom=1;particles=[];rings=[];trails=[];shards=[];hud()";

    if(!html.includes(resizeNeedle))throw new Error('V12 resize hook not found');
    if(!html.includes(cameraNeedle))throw new Error('V12 camera hook not found');
    if(!html.includes(resetNeedle))throw new Error('V12 reset hook not found');

    html=html.replace(resizeNeedle,resizeFixed);
    html=html.replace(cameraNeedle,cameraFixed);
    html=html.replace(resetNeedle,resetFixed);

    const fixedCss=`<style id="hl12-fixed-iphone">
html,body,#app{width:1280px!important;height:720px!important;min-width:1280px!important;min-height:720px!important;max-width:1280px!important;max-height:720px!important}
html{overflow:hidden!important}
body{position:relative!important;inset:auto!important;overflow:hidden!important}
#app{position:relative!important;overflow:hidden!important}
canvas{width:1280px!important;height:720px!important}
.screen{width:1280px!important;height:720px!important}
.card{width:760px!important;padding:30px 34px!important}
.result{width:580px!important}
h1{font-size:92px!important}.tagline{margin:17px 0 22px!important}.controls>div{padding:13px 15px!important}#start{height:58px!important}.meta{margin-top:13px!important}.rank{font-size:92px!important}
</style>`;
    if(!html.includes('</head>'))throw new Error('V12 head not found');
    return html.replace('</head>',fixedCss+'</head>');
  }

  async function loadGame(){
    try{
      const res=await fetch(GAME_URL+'?camera-fix=2',{cache:'no-store'});
      if(!res.ok)throw new Error('HTTP '+res.status);
      frame.srcdoc=patchGame(await res.text());
    }catch(err){
      console.error('HEAVY/LIGHT fixed iPhone bootstrap failed',err);
      frame.src=GAME_URL+'?fallback=1';
    }
  }

  function wireGame(){
    ready=true;
    try{
      const d=frame.contentDocument;
      d?.getElementById('start')?.addEventListener('pointerdown',freeze,{passive:true});
      d?.getElementById('retry')?.addEventListener('pointerdown',freeze,{passive:true});
      d?.getElementById('back')?.addEventListener('pointerdown',unfreeze,{passive:true});
    }catch(e){}
    schedule(true);
  }

  addEventListener('resize',()=>schedule(false),{passive:true});
  addEventListener('orientationchange',()=>{locked=false;schedule(true);setTimeout(()=>schedule(true),120);setTimeout(()=>schedule(true),420)},{passive:true});
  if(window.visualViewport){
    visualViewport.addEventListener('resize',()=>schedule(false),{passive:true});
    visualViewport.addEventListener('scroll',()=>schedule(false),{passive:true});
  }
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!locked)setTimeout(()=>schedule(true),80)});
  frame.addEventListener('load',wireGame);

  schedule(true);
  setTimeout(()=>schedule(true),80);
  loadGame();

  window.__HL12_IPHONE__={
    fit:()=>layout(true),freeze,unfreeze,
    state:()=>{
      const v=viewport(),r=stage.getBoundingClientRect();
      let inner={};
      try{
        const d=frame.contentDocument,cv=d?.getElementById('game'),app=d?.getElementById('app');
        const source=d?.documentElement?.innerHTML||'';
        inner={
          windowW:frame.contentWindow?.innerWidth||0,
          windowH:frame.contentWindow?.innerHeight||0,
          appW:app?.getBoundingClientRect().width||0,
          appH:app?.getBoundingClientRect().height||0,
          canvasCssW:cv?.getBoundingClientRect().width||0,
          canvasCssH:cv?.getBoundingClientRect().height||0,
          canvasW:cv?.width||0,
          canvasH:cv?.height||0,
          cameraFix:source.includes('camY=lerp(camY,clamp((p.y-430)*.08,-18,26),.09)'),
          game:frame.contentWindow?.__HL12__?.state?.()||null
        };
      }catch(e){}
      return {ready,locked,viewport:v,stage:{x:r.x,y:r.y,w:r.width,h:r.height},inner};
    }
  };
})();
</script>
</body>
</html>
