<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#04060b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>HEAVY / LIGHT — Pulse Circuit</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#04060b;color:#8cf8ff;font:800 12px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.15em}div{text-align:center}</style></head><body><div>LOADING PULSE CIRCUIT…</div><script>(async()=>{const names=['p01.txt','p02.txt','p03.txt','p04.txt','p05.txt','p06.txt','p07.txt','p08.txt'];const parts=await Promise.all(names.map(async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('load '+u);return r.text()}));const b=Uint8Array.from(atob(parts.join('')),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([b]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()})().catch(e=>{console.error(e);document.body.innerHTML='<div>LOAD ERROR<br><small>BITTE SEITE NEU LADEN</small></div>'})</script></body></html>
