<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08100b"><title>Briefly</title><style>
:root{--g:#4bd64a;--b:#08100b;--s:#131b16;--l:#29332d;--t:#f5f7f5;--m:#95a099;--blue:#4dafff;--red:#ff5a5a}*{box-sizing:border-box}body{margin:0;background:var(--b);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial;padding:env(safe-area-inset-top) 14px calc(90px + env(safe-area-inset-bottom));min-height:100dvh}main{max-width:520px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;padding:12px 4px 20px}h1{margin:0;font-size:26px}.muted{color:var(--m);font-size:13px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:16px}.tabs button,.btn{border:1px solid var(--l);background:var(--s);color:var(--t);border-radius:14px;padding:12px 14px;font-weight:750}.tabs button.on,.primary{background:var(--g);color:#071008;border-color:var(--g)}section{display:none}section.on{display:block}.hero{text-align:center;padding:24px 8px}.mic{width:170px;height:170px;margin:26px auto;border-radius:50%;border:2px solid var(--g);background:#102414;color:var(--g);display:grid;place-items:center;font-size:68px;box-shadow:0 0 40px #4bd64a33}.mic.live{background:#421616;color:white;border-color:var(--red);animation:p 1s infinite}@keyframes p{50%{transform:scale(1.04)}}textarea,input,select{width:100%;background:#0d140f;color:var(--t);border:1px solid var(--l);border-radius:14px;padding:13px;font:inherit}.btn{width:100%;margin-top:10px}.card{background:var(--s);border:1px solid var(--l);border-radius:17px;margin:10px 0;overflow:hidden}.row{padding:14px;border-bottom:1px solid var(--l)}.row:last-child{border:0}.who{font-weight:800;color:var(--g);margin-bottom:5px}.info{color:var(--blue)}.meta{font-size:11px;color:var(--m);margin-top:5px}.actions{display:flex;gap:7px;margin-top:9px}.actions button{border:1px solid var(--l);background:#0d140f;color:var(--t);border-radius:10px;padding:8px;font-size:12px}.empty{padding:20px;text-align:center;color:var(--m)}.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;border:0;background:var(--g);font-size:32px;color:#071008;box-shadow:0 10px 35px #000}.sheet{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:flex-end}.sheet.on{display:flex}.panel{background:#151d18;width:100%;max-width:520px;margin:auto;border-radius:26px 26px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-height:90dvh;overflow:auto}.panel h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toast{position:fixed;top:calc(14px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-20px);opacity:0;background:white;color:#102014;padding:10px 15px;border-radius:99px;font-weight:800;transition:.2s;z-index:20}.toast.on{opacity:1;transform:translate(-50%,0)}</style></head><body><div class="toast" id="toast"></div><main><header><div><h1>Briefly</h1><div class="muted" id="date"></div></div><button class="tabs" id="settings">⚙︎</button></header><nav class="tabs"><button data-v="brief" class="on">Briefing</button><button data-v="tasks">Aufgaben</button><button data-v="infos">Infos</button><button data-v="team">Team</button></nav>
<section id="brief" class="on"><div class="hero"><div class="mic" id="mic">🎙</div><h2>Morgenbriefing</h2><p class="muted">Einmal tippen, frei sprechen, prüfen und verteilen.</p></div><textarea id="speech" placeholder="Hier erscheint das Diktat. Auf dem iPhone kannst du auch das Mikrofon der Tastatur verwenden."></textarea><button class="btn primary" id="analyse">Briefing auswerten</button><button class="btn" id="demo">Beispiel einsetzen</button><div id="preview"></div></section>
<section id="tasks"><h2>Aufgaben</h2><div id="taskList"></div></section><section id="infos"><h2>Informationen für alle</h2><div id="infoList"></div></section><section id="team"><h2>Team</h2><div id="teamList"></div></section></main><button class="fab" id="quick">＋</button>
<div class="sheet" id="quickSheet"><div class="panel"><h2>Schnell erfassen</h2><textarea id="quickText" placeholder="Zum Beispiel: Marco soll heute noch die Paletten wegräumen. Oder: Information, die Lieferung verspätet sich."></textarea><div class="grid"><button class="btn" id="quickSpeak">🎙 Sprechen</button><button class="btn" id="closeQuick">Schließen</button></div><button class="btn primary" id="saveQuick">Erkennen und speichern</button></div></div>
<div class="sheet" id="settingsSheet"><div class="panel"><h2>Einstellungen</h2><label class="muted">Mein Name</label><input id="myName"><label class="muted">Mitarbeitende, mit Komma getrennt</label><input id="employees"><button class="btn primary" id="saveSettings">Speichern</button><button class="btn" id="closeSettings">Schließen</button></div></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let st=JSON.parse(localStorage.briefly||'null')||{me:'Oliver',emps:['Oliver','Marco','Pascal'],tasks:[],infos:[],absent:[]};const save=()=>localStorage.briefly=JSON.stringify(st);$('#date').textContent=new Intl.DateTimeFormat('de-CH',{weekday:'long',day:'2-digit',month:'long'}).format(new Date());function toast(t){$('#toast').textContent=t;$('#toast').classList.add('on');setTimeout(()=>$('#toast').classList.remove('on'),1500)}function view(id){$$('section').forEach(x=>x.classList.toggle('on',x.id===id));$$('[data-v]').forEach(x=>x.classList.toggle('on',x.dataset.v===id))}$$('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
function employee(s){return st.emps.find(e=>new RegExp('\\b'+e+'\\b','i').test(s))||''}function cleanTask(s,n){return s.replace(new RegExp('^.*?'+n+'\\s+(?:soll|macht|übernimmt|erledigt|bearbeitet)?\\s*','i'),'').replace(/^(?:bitte|heute|noch)\s+/i,'').trim()}function parseText(txt){let parts=txt.replace(/\b(nein|stopp|korrektur)\b/gi,'. $1 ').split(/[.!?\n]+/).map(x=>x.trim()).filter(Boolean),tasks=[],infos=[],abs=[];for(let i=0;i<parts.length;i++){let s=parts[i],n=employee(s);if(/nicht da|abwesend|fehlt heute/i.test(s)&&n){abs.push(n);continue}if(/^(info|information|achtung|zur info)/i.test(s)||(!n&&/(kommt|verspätet|geschlossen|offen|fällt aus)/i.test(s))){infos.push(s.replace(/^(info(?:rmation)?|achtung|zur info)[:,]?\s*/i,''));continue}if(/^nein|^korrektur/i.test(s)){let n2=employee(s);if(n2&&tasks.length)tasks[tasks.length-1].person=n2;continue}if(n){let text=cleanTask(s,n);if(text)tasks.push({id:crypto.randomUUID?.()||Date.now()+Math.random(),person:n,text,done:false,by:st.me})}else if(s.length>5)tasks.push({id:crypto.randomUUID?.()||Date.now()+Math.random(),person:'',text:s,done:false,by:st.me})}return{tasks,infos,abs}}
function render(){let grouped={};st.tasks.forEach(t=>(grouped[t.person||'Offen']??=[]).push(t));$('#taskList').innerHTML=st.tasks.length?Object.entries(grouped).map(([p,ts])=>`<div class="card"><div class="row who">${esc(p)}</div>${ts.map(t=>`<div class="row"><b>${esc(t.text)}</b><div class="meta">Von ${esc(t.by||'Leitung')}</div><div class="actions">${!t.person?`<button onclick="take('${t.id}')">Ich übernehme</button>`:''}<button onclick="done('${t.id}')">${t.done?'Wieder öffnen':'Erledigt'}</button><button onclick="delTask('${t.id}')">Löschen</button></div></div>`).join('')}</div>`).join(''):'<div class="card empty">Noch keine Aufgaben.</div>';$('#infoList').innerHTML=st.infos.length?`<div class="card">${st.infos.map((x,i)=>`<div class="row"><b class="info">${esc(x.text||x)}</b><div class="meta">Von ${esc(x.by||'Leitung')}</div><div class="actions"><button onclick="delInfo(${i})">Löschen</button></div></div>`).join('')}</div>`:'<div class="card empty">Noch keine Informationen.</div>';$('#teamList').innerHTML=`<div class="card">${st.emps.map(e=>`<div class="row"><b>${esc(e)}</b><div class="meta">${st.absent.includes(e)?'Abwesend':st.tasks.filter(t=>t.person===e&&!t.done).length+' offene Aufgaben'}</div></div>`).join('')}</div>`;save()}window.take=id=>{let t=st.tasks.find(x=>x.id===id);t.person=st.me;render();toast('Aufgabe übernommen')};window.done=id=>{let t=st.tasks.find(x=>x.id===id);t.done=!t.done;render()};window.delTask=id=>{st.tasks=st.tasks.filter(x=>x.id!==id);render()};window.delInfo=i=>{st.infos.splice(i,1);render()};
function addParsed(r){st.tasks.push(...r.tasks);st.infos.push(...r.infos.map(text=>({text,by:st.me})));st.absent=[...new Set([...st.absent,...r.abs])];render()}$('#analyse').onclick=()=>{let r=parseText($('#speech').value);addParsed(r);$('#preview').innerHTML=`<div class="card"><div class="row"><b>${r.tasks.length}</b> Aufgaben erkannt</div><div class="row"><b>${r.infos.length}</b> Informationen erkannt</div><div class="row"><b>${r.abs.length}</b> Abwesenheiten erkannt</div></div>`;toast('Briefing ausgewertet')};$('#demo').onclick=()=>$('#speech').value='Oliver bearbeitet die Pflanzenlieferung. Pascal übernimmt die Kasse. Information: Heute kommt um 10 Uhr der Regionalleiter. Pascal ist heute nicht da. Nein, Marco übernimmt die Kasse.';
let rec=null;function speak(target){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){target.focus();toast('Bitte iPhone-Tastaturmikrofon verwenden');return}rec=new SR();rec.lang='de-CH';rec.interimResults=true;rec.onresult=e=>target.value=[...e.results].map(r=>r[0].transcript).join(' ');rec.onend=()=>$('#mic').classList.remove('live');rec.start();$('#mic').classList.add('live');toast('Sprich jetzt')}$('#mic').onclick=()=>speak($('#speech'));$('#quick').onclick=()=>$('#quickSheet').classList.add('on');$('#closeQuick').onclick=()=>$('#quickSheet').classList.remove('on');$('#quickSpeak').onclick=()=>speak($('#quickText'));$('#saveQuick').onclick=()=>{let r=parseText($('#quickText').value);addParsed(r);$('#quickText').value='';$('#quickSheet').classList.remove('on');view(r.infos.length&&!r.tasks.length?'infos':'tasks');toast('Gespeichert')};$('#settings').onclick=()=>{$('#myName').value=st.me;$('#employees').value=st.emps.join(', ');$('#settingsSheet').classList.add('on')};$('#closeSettings').onclick=()=>$('#settingsSheet').classList.remove('on');$('#saveSettings').onclick=()=>{st.me=$('#myName').value.trim()||'Oliver';st.emps=$('#employees').value.split(',').map(x=>x.trim()).filter(Boolean);render();$('#settingsSheet').classList.remove('on');toast('Gespeichert')};render();
</script></body></html>
