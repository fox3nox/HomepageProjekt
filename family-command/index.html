<!doctype html>
<html lang="de" data-fc-v9="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Family Command">
  <meta name="format-detection" content="telephone=no">
  <title>Family Command</title>
  <link rel="manifest" href="./manifest.webmanifest?v=20260828-v900">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <style>
    html,body{margin:0;min-height:100%;background:#f6f8fb;color-scheme:light}
    #fcApp{visibility:hidden}
    .fc9-boot{position:fixed;inset:0;z-index:100000;background:#f6f8fb;display:grid;place-items:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.fc9-boot-box{width:min(100%,430px)}.fc9-boot-brand{display:flex;align-items:center;gap:10px;font-weight:900;color:#172033}.fc9-boot-mark{width:36px;height:36px;border-radius:11px;background:#263a67;color:#fff;display:grid;place-items:center;font-size:10px}.fc9-boot-bar{height:4px;margin-top:18px;border-radius:999px;background:#e3e8ef;overflow:hidden}.fc9-boot-bar i{display:block;width:48%;height:100%;background:#263a67;border-radius:inherit;animation:fc9load 1s ease-in-out infinite alternate}.fc9-boot p{color:#8491a4;font-size:10px;margin-top:9px}@keyframes fc9load{to{transform:translateX(105%)}}
  </style>
</head>
<body>
  <div id="fcBoot" class="fc9-boot"><div class="fc9-boot-box"><div class="fc9-boot-brand"><div class="fc9-boot-mark">FC</div><span>Family Command</span></div><div class="fc9-boot-bar"><i></i></div><p>Deine Familienübersicht wird vorbereitet …</p></div></div>
  <div class="app" id="fcApp"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
  (()=>{
    'use strict';
    window.__fcManagedBoot=true;window.__fcV9Boot=true;
    const STORE='fc-private-access-v1',COOKIE='fc_private_access',PRIVATE_APP='https://lmrvapstojcecljjdgds.supabase.co/functions/v1/family-command-private-app',params=new URLSearchParams(location.search);
    const VERSION='20260828-v900',PRIVATE_CODE_VERSION='family-command-app-v3-managed1',PRIVATE_CACHE='fc-private-app-code-v2';
    const CRITICAL=['event-details.js','chat-command-sync.js','app-data-rules.js','v9-data.js','event-delete-fix.js','multi-link-ui.js','v9-app.js','homework-originals.js'];
    const DEFERRED=['push-v2.js','runtime-health.js','family-ai-v2.js','ai-budget-guard.js','family-ai-original-links.js','print-planner-v2.js','todo-print-addon.js','backup-manager.js','app-selftest-v6.js'];
    const NO_OBSERVER=new Set(['event-details.js']);
    let extrasPromise=null;
    function readCookie(name){const prefix=name+'=',part=document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith(prefix));return part?decodeURIComponent(part.slice(prefix.length)):''}
    function saveAccess(value){try{localStorage.setItem(STORE,value)}catch(e){}document.cookie=COOKIE+'='+encodeURIComponent(value)+'; Max-Age=31536000; Path=/HomepageProjekt/family-command/; Secure; SameSite=Strict'}
    function fatal(message){document.documentElement.dataset.fcReady='1';const boot=document.getElementById('fcBoot');if(boot)boot.innerHTML='<div class="fc9-boot-box"><div class="fc9-boot-brand">Family Command</div><p></p></div>';boot?.querySelector('p')?.append(String(message||'Die App konnte nicht geladen werden.'))}
    let key=params.get('access')||readCookie(COOKIE)||'';if(!key){try{key=localStorage.getItem(STORE)||''}catch(e){}}
    if(params.get('access')){saveAccess(key);params.delete('access');history.replaceState(null,'',location.pathname+(params.toString()?'?'+params.toString():'')+location.hash)}else if(key)saveAccess(key);
    if(!key){fatal('Privater Zugang erforderlich. Öffne deinen persönlichen Family-Command-Link einmal in Safari.');return}
    const browserFetch=window.fetch.bind(window),wait=ms=>new Promise(r=>setTimeout(r,ms)),frame=()=>new Promise(r=>requestAnimationFrame(r));
    window.fetch=function(input,init){try{const u=typeof input==='string'?input:(input instanceof Request?input.url:'');if(u.includes('/functions/v1/family-command-app/push/'))return Promise.resolve(new Response(JSON.stringify({ok:true,skipped:true}),{status:200,headers:{'content-type':'application/json'}}))}catch(e){}return browserFetch(input,init)};
    async function fetchText(src){let last='';for(let attempt=0;attempt<2;attempt++){try{const r=await browserFetch(src,{cache:attempt?'reload':'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}catch(e){last=e?.message||String(e);if(!attempt)await wait(70)}}throw new Error('Datei konnte nicht geladen werden: '+src+(last?' ('+last+')':''))}
    function execute(code,src){const s=document.createElement('script');s.textContent=code+'\n//# sourceURL='+src.split('?')[0];document.body.appendChild(s)}
    function executeCritical(file,code){const nativeMO=window.MutationObserver;if(NO_OBSERVER.has(file))window.MutationObserver=class{observe(){}disconnect(){}takeRecords(){return[]}};try{execute(code,'./'+file+'?v='+VERSION)}finally{window.MutationObserver=nativeMO}}
    function executeDeferred(file,code){const protectedNames=['openScreen','renderToday','renderTomorrow','renderWeek','renderEvents','renderHomeworkScreen','renderMore','renderPeople'],before={};for(const n of protectedNames)before[n]=window[n];try{execute(code,'./'+file+'?v='+VERSION)}finally{if(window.__fcV9){for(const n of protectedNames)if(before[n]){window[n]=before[n];try{globalThis[n]=before[n]}catch(e){}}}}}
    function readPrivateCache(){try{const x=JSON.parse(localStorage.getItem(PRIVATE_CACHE)||'null');return x&&x.version===PRIVATE_CODE_VERSION&&typeof x.code==='string'?x.code:''}catch(e){return''}}
    function writePrivateCache(code){try{localStorage.setItem(PRIVATE_CACHE,JSON.stringify({version:PRIVATE_CODE_VERSION,code,at:Date.now()}))}catch(e){}}
    function fetchPrivate(){return browserFetch(PRIVATE_APP+'?v='+PRIVATE_CODE_VERSION,{cache:'no-store',headers:{'x-fc-access':key}}).then(async r=>{if(!r.ok)throw new Error('Privater App-Kern nicht erreichbar ('+r.status+').');return r.text()})}
    function loadCss(){return new Promise((resolve,reject)=>{const l=document.createElement('link');l.rel='stylesheet';l.href='./v9.css?v='+VERSION;l.onload=resolve;l.onerror=reject;document.head.appendChild(l)})}
    function idle(fn,delay=0){setTimeout(()=>{'requestIdleCallback'in window?requestIdleCallback(fn,{timeout:2200}):setTimeout(fn,40)},delay)}
    async function loadExtras(){if(extrasPromise)return extrasPromise;extrasPromise=(async()=>{for(const file of DEFERRED){try{executeDeferred(file,await fetchText('./'+file+'?v='+VERSION))}catch(e){console.error('fc9_deferred',file,e)}await wait(25)}document.documentElement.dataset.fcExtras='ready';return true})();return extrasPromise}
    window.__fcLoadExtrasNow=loadExtras;
    async function boot(){
      const start=performance.now(),cachedPrivate=readPrivateCache(),freshPrivate=fetchPrivate(),downloads=new Map(CRITICAL.map(file=>[file,fetchText('./'+file+'?v='+VERSION)]));
      const privateCode=cachedPrivate||await freshPrivate;execute(privateCode,cachedPrivate?'family-command-private-app.cached.js':'family-command-private-app.js');
      await loadCss();
      for(const file of CRITICAL)executeCritical(file,await downloads.get(file));
      if(!window.__fcV9)throw new Error('V9-Oberfläche konnte nicht gestartet werden.');
      document.documentElement.dataset.fcBoot='v9-clean-ok';document.documentElement.dataset.fcBootMs=String(Math.round(performance.now()-start));
      await frame();document.getElementById('fcApp').style.visibility='visible';document.getElementById('fcBoot')?.remove();document.documentElement.dataset.fcReady='1';
      freshPrivate.then(writePrivateCache).catch(e=>console.error('fc_private_refresh',e));idle(()=>loadExtras(),3500);
    }
    boot().catch(e=>{console.error('family_command_v9_boot',e);fatal(e?.message)});
  })();
  </script>
</body>
</html>
