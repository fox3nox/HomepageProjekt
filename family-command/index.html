<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Family Command">
  <meta name="format-detection" content="telephone=no">
  <title>Family Command</title>
  <link rel="manifest" href="./manifest.webmanifest?v=20260824-pro612">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css?v=20260824-pro612">
  <link rel="stylesheet" href="./screen-redesign-v6.css?v=20260824-pro612">
  <style>
    html:not([data-fc-ready="1"]) .content{visibility:hidden!important}
    .v6-today-title{display:block!important;margin:4px 0 0!important;color:#fff!important;font-size:31px!important;line-height:1.05!important;font-weight:820!important;letter-spacing:-.045em!important}
    .v6-person-checks{display:grid;grid-template-columns:1fr 1fr;gap:7px}.v6-person-check{min-height:42px;display:flex;align-items:center;gap:8px;border:1px solid #1d3047;background:#091522;border-radius:12px;padding:8px 10px;color:#dbe4ef}.v6-person-check input{width:18px!important;height:18px!important;min-height:0!important;accent-color:#665cff}.v6-person-check b{font-size:12px}.v6-person-check .v6-dot{flex:none}
    #eventModal{background:rgba(0,5,13,.72)!important;backdrop-filter:blur(10px)!important;-webkit-backdrop-filter:blur(10px)!important;padding:10px!important;align-items:flex-end!important;justify-content:center!important}
    #eventModal .sheet{width:min(100%,460px)!important;max-height:91dvh!important;overflow:auto!important;background:#0d1928!important;border:1px solid #1d3047!important;color:#fff!important;border-radius:22px!important;padding:16px!important;box-shadow:0 24px 70px rgba(0,0,0,.48)!important;margin-bottom:max(3px,env(safe-area-inset-bottom,0px))!important}
    #eventModal .sheet h3{margin:0 0 14px!important;color:#fff!important;font-size:20px!important;letter-spacing:-.025em!important}
    #eventModal .field label{display:block!important;margin:0 0 5px!important;color:#7e8fa7!important;font-size:9px!important;font-weight:850!important;letter-spacing:.09em!important}
    #eventModal .field input,#eventModal .field select,#eventModal .field textarea{width:100%!important;min-height:44px!important;border:1px solid #1d3047!important;background:#091522!important;color:#f2f5f9!important;border-radius:12px!important;padding:10px 11px!important;font-size:13px!important}
    #eventModal .field textarea{min-height:84px!important}.row2{gap:8px!important}
    #eventModal .action{min-height:44px!important;border-radius:12px!important;font-size:13px!important;font-weight:780!important}#eventModal #saveEvent{background:linear-gradient(145deg,#625cff,#4d7dff)!important;color:#fff!important}#eventModal #closeEvent{background:#132133!important;color:#cbd5e2!important;border:1px solid #1d3047!important}
    @media(max-width:350px){.v6-person-checks{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-in">
        <div class="brand">
          <div class="mark">FC</div>
          <div><h1>Family Command</h1><p>Alles Wichtige, bevor der Tag losgeht.</p></div>
        </div>
        <button type="button" class="iconbtn" id="quickAdd" aria-label="Schnell hinzufügen">＋</button>
      </div>
    </header>
    <main class="content">
      <section id="today" class="screen active"></section>
      <section id="tomorrow" class="screen"></section>
      <section id="week" class="screen"></section>
      <section id="people" class="screen"></section>
      <section id="events" class="screen"></section>
      <section id="more" class="screen"></section>
    </main>
    <nav class="bottomnav" aria-label="Hauptnavigation">
      <div class="bottomnav-in" data-fc-six-nav="1">
        <button type="button" class="navbtn active" data-screen="today"><span class="ico">⌂</span><span>Heute</span></button>
        <button type="button" class="navbtn" data-screen="tomorrow"><span class="ico">☀</span><span>Morgen</span></button>
        <button type="button" class="navbtn" data-screen="week"><span class="ico">▦</span><span>Woche</span></button>
        <button type="button" class="navbtn" data-screen="homework"><span class="ico">✓</span><span>Aufgaben</span></button>
        <button type="button" class="navbtn" data-screen="events"><span class="ico">◷</span><span>Termine</span></button>
        <button type="button" class="navbtn" data-screen="more"><span class="ico">•••</span><span>Mehr</span></button>
      </div>
    </nav>
  </div>
  <div class="modal" id="eventModal">
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
      <h3 id="eventModalTitle">Termin hinzufügen</h3>
      <div class="fields">
        <div class="field"><label for="eventPerson">FÜR</label><select id="eventPerson"></select></div>
        <div class="field"><label for="eventTitle">TITEL</label><input id="eventTitle" autocomplete="off" placeholder="z. B. Arzttermin"></div>
        <div class="row2">
          <div class="field"><label for="eventDate">DATUM</label><input id="eventDate" type="date"></div>
          <div class="field"><label for="eventTime">ZEIT</label><input id="eventTime" type="time"></div>
        </div>
        <div class="field"><label for="eventNote">NOTIZ</label><textarea id="eventNote" placeholder="Ort, was mitnehmen, weitere Infos …"></textarea></div>
        <button type="button" class="action" id="saveEvent">Speichern</button>
        <button type="button" class="action light" id="closeEvent">Abbrechen</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script>
  (()=>{
    const STORE='fc-private-access-v1',COOKIE='fc_private_access';
    const PRIVATE_APP='https://lmrvapstojcecljjdgds.supabase.co/functions/v1/family-command-private-app';
    const params=new URLSearchParams(location.search);
    function readCookie(name){const prefix=name+'=';const part=document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith(prefix));return part?decodeURIComponent(part.slice(prefix.length)):''}
    function saveAccess(value){try{localStorage.setItem(STORE,value)}catch(e){}document.cookie=COOKIE+'='+encodeURIComponent(value)+'; Max-Age=31536000; Path=/HomepageProjekt/family-command/; Secure; SameSite=Strict'}
    function fatal(message){document.documentElement.dataset.fcReady='1';const root=document.querySelector('.content');if(root){root.textContent='';const section=document.createElement('section');section.className='screen active';section.innerHTML='<div class="hero"><h2>App konnte nicht vollständig geladen werden.</h2><p></p></div>';section.querySelector('p').textContent=String(message||'Bitte die App einmal vollständig schließen und neu öffnen.');root.appendChild(section)}const nav=document.querySelector('.bottomnav'),add=document.getElementById('quickAdd');if(nav)nav.style.display='none';if(add)add.style.display='none'}
    let key=params.get('access')||readCookie(COOKIE)||'';if(!key){try{key=localStorage.getItem(STORE)||''}catch(e){}}
    if(params.get('access')){saveAccess(key);params.delete('access');const clean=location.pathname+(params.toString()?'?'+params.toString():'')+location.hash;history.replaceState(null,'',clean)}else if(key)saveAccess(key);
    if(!key){fatal('Privater Zugang erforderlich. Öffne deinen persönlichen Family-Command-Link einmal in Safari.');return}
    const browserFetch=window.fetch.bind(window);
    window.fetch=function(input,init){try{const u=typeof input==='string'?input:(input instanceof Request?input.url:'');if(u.includes('/functions/v1/family-command-app/push/'))return Promise.resolve(new Response(JSON.stringify({ok:true,skipped:true}),{status:200,headers:{'content-type':'application/json'}}))}catch(e){}return browserFetch(input,init)};
    function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=()=>resolve();s.onerror=()=>reject(new Error('Datei konnte nicht geladen werden: '+src));document.body.appendChild(s)})}
    function injectPrivate(code){const s=document.createElement('script');s.textContent=code+'\n//# sourceURL=family-command-private-app.js';document.body.appendChild(s)}
    async function boot(){
      const v='20260824-pro612';
      const r=await browserFetch(PRIVATE_APP+'?v='+v,{cache:'no-store',headers:{'x-fc-access':key}});if(!r.ok)throw new Error('Privater App-Kern nicht erreichbar ('+r.status+').');
      injectPrivate(await r.text());if(typeof window.fcEventFilter==='undefined')window.fcEventFilter='all';
      await loadScript('./ai-budget-guard.js?v='+v);
      await loadScript('./push-v2.js?v='+v);
      await loadScript('./pro-ui.js?v='+v);
      await loadScript('./runtime-health.js?v='+v);
      await loadScript('./family-ai-v2.js?v='+v);
      await loadScript('./family-ai-original-links.js?v='+v);
      await loadScript('./pendencies.js?v='+v);
      await loadScript('./event-details.js?v='+v);
      await loadScript('./multi-link-ui.js?v='+v);
      await loadScript('./event-delete-fix.js?v='+v);
      await loadScript('./professional-ui.js?v='+v);
      await loadScript('./screen-redesign-v6.js?v='+v);
      await loadScript('./app-data-rules.js?v='+v);
      await loadScript('./today-relevance.js?v='+v);
      await loadScript('./tomorrow-preview.js?v='+v);
      await loadScript('./tomorrow-screen.js?v='+v);
      await loadScript('./nav-six-fix.js?v='+v);
      await loadScript('./daily-checklist.js?v='+v);
      await loadScript('./todo-list.js?v='+v);
      await loadScript('./print-planner-v2.js?v='+v);
      await loadScript('./todo-print-addon.js?v='+v);
      await loadScript('./week-overview-v2.js?v='+v);
      await loadScript('./homework-originals.js?v='+v);
      await loadScript('./backup-manager.js?v='+v);
      await loadScript('./today-addons-stabilizer.js?v='+v);
      await loadScript('./app-selftest-v6.js?v='+v);
      document.documentElement.dataset.fcBoot='pro6.12-ok';
      try{window.__fcScreenRedesignAudit?.();window.__fcSixNav?.ensure?.();window.__fcDailyChecklist?.render?.();window.__fcTodo?.render?.();window.fcRunSelfTest?.()}catch(e){}
      requestAnimationFrame(()=>requestAnimationFrame(()=>{
        document.documentElement.dataset.fcReady='1';
        try{window.__fcTodayAddonsStabilizer?.repair?.()}catch(e){}
      }));
    }
    boot().catch(e=>{console.error('family_command_boot',e);fatal(e?.message)});
  })();
  </script>
</body>
</html>
