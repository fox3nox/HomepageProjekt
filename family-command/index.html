<!doctype html>
<html lang="de" data-fc-v9="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f8fb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Familie">
  <meta name="format-detection" content="telephone=no">
  <title>Familienzentrale</title>
  <link rel="manifest" href="./manifest.webmanifest?v=20260830-v9120">
  <link rel="icon" href="./icon.svg?v=20260830-v9120" type="image/svg+xml">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=20260830-v9120">
  <style>
    html,body{margin:0;min-height:100%;background:#f6f8fb;color-scheme:light}
    #fcApp{visibility:hidden}
    .fc9-boot{position:fixed;inset:0;z-index:100000;background:#f6f8fb;display:grid;place-items:center;padding:20px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.fc9-boot-box{width:min(100%,430px)}.fc9-boot-brand{display:flex;align-items:center;gap:10px;font-weight:900;color:#172033}.fc9-boot-mark{width:36px;height:36px;border-radius:11px;overflow:hidden;background:#17265d;display:grid;place-items:center}.fc9-boot-mark img{display:block;width:100%;height:100%;object-fit:cover}.fc9-boot-bar{height:4px;margin-top:18px;border-radius:999px;background:#e3e8ef;overflow:hidden}.fc9-boot-bar i{display:block;width:48%;height:100%;background:#263a67;border-radius:inherit;animation:fc9load 1s ease-in-out infinite alternate}.fc9-boot p{color:#8491a4;font-size:10px;margin-top:9px}@keyframes fc9load{to{transform:translateX(105%)}}
  </style>
</head>
<body>
  <div id="fcBoot" class="fc9-boot"><div class="fc9-boot-box"><div class="fc9-boot-brand"><div class="fc9-boot-mark"><img src="./apple-touch-icon.png?v=20260830-v9120" alt=""></div><span>Familienzentrale</span></div><div class="fc9-boot-bar"><i></i></div><p>Deine Familienübersicht wird vorbereitet …</p></div></div>
  <div class="app" id="fcApp"></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
  (()=>{
    'use strict';
    window.__fcManagedBoot=true;window.__fcV9Boot=true;
    const STORE='fc-private-access-v1',COOKIE='fc_private_access',params=new URLSearchParams(location.search);
    const PRIVATE_CONFIG='https://lmrvapstojcecljjdgds.supabase.co/functions/v1/family-command-private-config';
    const VERSION='20260830-v9120',PRIVATE_RULES_VERSION='2026-08-30-v1',PRIVATE_RULES_CACHE='fc-private-rules-code-v1';
    const CRITICAL=['core-runtime.js','cloud-state.js','event-details.js','chat-command-sync.js','app-data-rules.js','v9-data.js','event-delete-fix.js','multi-link-ui.js','v9-app.js','v9-professional.js','homework-originals.js'];
    const DEFERRED=['push-v2.js','runtime-health.js','family-ai-v2.js','ai-budget-guard.js','family-ai-original-links.js','print-planner-v2.js','backup-manager.js','app-selftest-v9.js'];
    let extrasPromise=null;
    function readCookie(name){const prefix=name+'=',part=document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith(prefix));return part?decodeURIComponent(part.slice(prefix.length)):''}
    function saveAccess(value){try{localStorage.setItem(STORE,value)}catch(e){}document.cookie=COOKIE+'='+encodeURIComponent(value)+'; Max-Age=31536000; Path=/HomepageProjekt/family-command/; Secure; SameSite=Strict'}
    function fatal(message){document.documentElement.dataset.fcReady='1';const boot=document.getElementById('fcBoot');if(boot)boot.innerHTML='<div class="fc9-boot-box"><div class="fc9-boot-brand">Familienzentrale</div><p></p></div>';boot?.querySelector('p')?.append(String(message||'Die App konnte nicht geladen werden.'))}
    let key=params.get('access')||readCookie(COOKIE)||'';if(!key){try{key=localStorage.getItem(STORE)||''}catch(e){}}
    if(params.get('access')){saveAccess(key);params.delete('access');history.replaceState(null,'',location.pathname+(params.toString()?'?'+params.toString():'')+location.hash)}else if(key)saveAccess(key);
    if(!key){fatal('Privater Zugang erforderlich. Öffne deinen persönlichen Familienzentrale-Link einmal in Safari.');return}
    const browserFetch=window.fetch.bind(window),wait=ms=>new Promise(r=>setTimeout(r,ms)),frame=()=>new Promise(r=>requestAnimationFrame(r));
    async function fetchText(src){let last='';for(let attempt=0;attempt<2;attempt++){try{const r=await browserFetch(src,{cache:attempt?'reload':'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}catch(e){last=e?.message||String(e);if(!attempt)await wait(70)}}throw new Error('Datei konnte nicht geladen werden: '+src+(last?' ('+last+')':''))}
    function execute(code,src){const s=document.createElement('script');s.textContent=code+'\n//# sourceURL='+src.split('?')[0];document.body.appendChild(s)}
    function executeCritical(file,code){execute(code,'./'+file+'?v='+VERSION)}
    function executeDeferred(file,code){const protectedNames=['openScreen','renderToday','renderTomorrow','renderWeek','renderEvents','renderHomeworkScreen','renderMore','renderPeople'],before={};for(const n of protectedNames)before[n]=window[n];try{execute(code,'./'+file+'?v='+VERSION)}finally{if(window.__fcV9){for(const n of protectedNames)if(before[n])window[n]=before[n]}}}
    function readRulesCache(){try{const x=JSON.parse(localStorage.getItem(PRIVATE_RULES_CACHE)||'null');return x&&x.version===PRIVATE_RULES_VERSION&&typeof x.code==='string'?x.code:''}catch(e){return''}}
    function writeRulesCache(code){try{localStorage.setItem(PRIVATE_RULES_CACHE,JSON.stringify({version:PRIVATE_RULES_VERSION,code,at:Date.now()}))}catch(e){}}
    function fetchPrivateRules(){if(key==='test'&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname))return fetchText('./e2e/mock-private-rules.js');return browserFetch(PRIVATE_CONFIG+'?v='+encodeURIComponent(PRIVATE_RULES_VERSION),{cache:'no-store',headers:{'x-fc-access':key}}).then(async r=>{if(!r.ok)throw new Error('Private Familienkonfiguration nicht erreichbar ('+r.status+').');return r.text()})}
    async function loadCss(){for(const file of ['v9.css','v9-professional.css'])await new Promise((resolve,reject)=>{const l=document.createElement('link');l.rel='stylesheet';l.href='./'+file+'?v='+VERSION;l.onload=resolve;l.onerror=reject;document.head.appendChild(l)})}
    function idle(fn,delay=0){setTimeout(()=>{'requestIdleCallback'in window?requestIdleCallback(fn,{timeout:2200}):setTimeout(fn,40)},delay)}
    async function loadExtras(){if(extrasPromise)return extrasPromise;extrasPromise=(async()=>{const codes=await Promise.all(DEFERRED.map(async file=>{try{return await fetchText('./'+file+'?v='+VERSION)}catch(e){console.error('fc9_deferred_fetch',file,e);return''}}));for(let i=0;i<DEFERRED.length;i++){if(codes[i]){try{executeDeferred(DEFERRED[i],codes[i])}catch(e){console.error('fc9_deferred_exec',DEFERRED[i],e)}}await wait(8)}document.documentElement.dataset.fcExtras='ready';return true})();return extrasPromise}
    window.__fcLoadExtrasNow=loadExtras;
    async function boot(){
      const start=performance.now(),downloads=new Map(CRITICAL.map(file=>[file,fetchText('./'+file+'?v='+VERSION)])),cssPromise=loadCss();
      const cachedRules=readRulesCache(),freshRules=fetchPrivateRules();
      executeCritical('core-runtime.js',await downloads.get('core-runtime.js'));
      if(!window.__fcCoreRuntime)throw new Error('Minimaler App-Kern konnte nicht gestartet werden.');
      const rulesCode=cachedRules||await freshRules;execute(rulesCode,cachedRules?'family-command-private-config.cached.js':'family-command-private-config.js');
      if(!window.FC_PRIVATE_RULES)throw new Error('Private Familienkonfiguration fehlt.');
      document.documentElement.dataset.fcPrivateRules=String(window.FC_PRIVATE_RULES.version||'ready');
      executeCritical('cloud-state.js',await downloads.get('cloud-state.js'));
      const cloudResult=await window.__fcCloudState?.bootstrap?.();
      document.documentElement.dataset.fcCloudState=String(window.__fcCloudState?.health?.().status||cloudResult?.source||'unknown');
      await cssPromise;
      for(const file of CRITICAL){if(file==='core-runtime.js'||file==='cloud-state.js')continue;executeCritical(file,await downloads.get(file))}
      if(!window.__fcV9)throw new Error('V9-Oberfläche konnte nicht gestartet werden.');
      document.documentElement.dataset.fcBoot='v9-runtime-ok';document.documentElement.dataset.fcBootMs=String(Math.round(performance.now()-start));
      await frame();document.getElementById('fcApp').style.visibility='visible';document.getElementById('fcBoot')?.remove();document.documentElement.dataset.fcReady='1';
      freshRules.then(writeRulesCache).catch(e=>console.error('fc_private_rules_refresh',e));
      try{navigator.serviceWorker?.register('./sw.js',{scope:'./'}).catch(()=>{})}catch(e){}
      idle(()=>loadExtras(),3500);
    }
    boot().catch(e=>{console.error('family_command_v9_boot',e);fatal(e?.message)});
  })();
  </script>
</body>
</html>
