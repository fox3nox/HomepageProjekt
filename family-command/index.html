<!doctype html>

  <style>
    html,body{background:#fff!important;color-scheme:light!important}
    html:not([data-fc-stable="1"]) *,html:not([data-fc-stable="1"]) *::before,html:not([data-fc-stable="1"]) *::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
    html:not([data-fc-ready="1"]) .bottomnav{pointer-events:none;opacity:.76}
    .fc-boot-screen{padding:30px 27px 110px;max-width:860px;margin:0 auto}.fc-boot-date{width:170px;height:18px;border-radius:9px;background:#edf1f7}.fc-boot-title{width:135px;height:48px;border-radius:15px;background:#e8edf5;margin-top:12px}.fc-boot-card{height:118px;border-radius:24px;background:#f5f7fb;border:1px solid #e5eaf1;margin-top:34px}.fc-boot-row{height:74px;border-radius:20px;background:#f8fafc;border:1px solid #e7ebf2;margin-top:14px}.fc-boot-note{margin-top:22px;color:#94a0b2;font:700 13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  </style>
  <link rel="stylesheet" href="./v8-foundation.css?v=20260828-v840">

  <link rel="stylesheet" href="./v8-overrides.css?v=20260828-v840">
</head>
<body>
  <div class="app">
    <header class="topbar"><div class="topbar-in"><div class="brand"><div class="mark">FC</div><div><h1>Family Command</h1><p>Alles Wichtige, bevor der Tag losgeht.</p></div></div><button type="button" class="iconbtn" id="quickAdd" aria-label="Schnell hinzufügen">＋</button></div></header>
    <main class="content">
      <section id="today" class="screen active"><div class="fc-boot-screen" aria-label="Family Command wird geladen"><div class="fc-boot-date"></div><div class="fc-boot-title"></div><div class="fc-boot-card"></div><div class="fc-boot-row"></div><div class="fc-boot-row"></div><div class="fc-boot-note">Family Command startet …</div></div></section>
      <section id="tomorrow" class="screen"></section><section id="week" class="screen"></section><section id="people" class="screen"></section><section id="events" class="screen"></section><section id="homework" class="screen"></section><section id="more" class="screen"></section>
    </main>
    <nav class="bottomnav" aria-label="Hauptnavigation"><div class="bottomnav-in" data-fc-v8-nav="1"><button type="button" class="navbtn active" data-screen="today"><span class="ico"><svg viewBox="0 0 24 24"><path d="M3.5 10.5 12 3l8.5 7.5v9A1.5 1.5 0 0 1 19 21h-4.5v-6h-5v6H5a1.5 1.5 0 0 1-1.5-1.5z"/></svg></span><span>Heute</span></button><button type="button" class="navbtn" data-screen="tomorrow"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg></span><span>Morgen</span></button><button type="button" class="navbtn" data-screen="events"><span class="ico"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M7 3v4M17 3v4M3.5 9.5h17M7 13h3M14 13h3M7 16.5h3"/></svg></span><span>Kalender</span></button><button type="button" class="navbtn" data-screen="homework"><span class="ico"><svg viewBox="0 0 24 24"><rect x="5" y="3.5" width="14" height="17" rx="2.3"/><path d="M8.2 10.2 10 12l3.4-3.5M8.2 16h7.5"/></svg></span><span>Aufgaben</span></button><button type="button" class="navbtn" data-screen="more"><span class="ico"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg></span><span>Mehr</span></button></div></nav>
  </div>
  <div class="modal" id="eventModal"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="eventModalTitle"><h3 id="eventModalTitle">Termin hinzufügen</h3><div class="fields"><div class="field"><label for="eventPerson">FÜR</label><select id="eventPerson"></select></div><div class="field"><label for="eventTitle">TITEL</label><input id="eventTitle" autocomplete="off" placeholder="z. B. Arzttermin"></div><div class="row2"><div class="field"><label for="eventDate">DATUM</label><input id="eventDate" type="date"></div><div class="field"><label for="eventTime">ZEIT</label><input id="eventTime" type="time"></div></div><div class="field"><label for="eventNote">NOTIZ</label><textarea id="eventNote" placeholder="Ort, was mitnehmen, weitere Infos …"></textarea></div><button type="button" class="action" id="saveEvent">Speichern</button><button type="button" class="action light" id="closeEvent">Abbrechen</button></div></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
  (()=>{
    const STORE='fc-private-access-v1',COOKIE='fc_private_access',PRIVATE_APP='https://lmrvapstojcecljjdgds.supabase.co/functions/v1/family-command-private-app',params=new URLSearchParams(location.search);
    const VERSION='20260828-v840',PRIVATE_CACHE='fc-private-app-code-v1';
    const CRITICAL=['screen-redesign-v6.js','app-data-rules.js','today-relevance.js','tomorrow-screen.js','daily-checklist.js','todo-list.js','tomorrow-preview.js','pendencies.js','event-details.js','multi-link-ui.js','event-delete-fix.js','homework-originals.js','today-addons-stabilizer.js','v8-ui.js','v8-shell.js','chat-command-sync.js'];
    const DEFERRED=['ai-budget-guard.js','push-v2.js','runtime-health.js','family-ai-v2.js','family-ai-original-links.js','print-planner-v2.js','todo-print-addon.js','backup-manager.js','app-selftest-v6.js'];
    function readCookie(name){const prefix=name+'=',part=document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith(prefix));return part?decodeURIComponent(part.slice(prefix.length)):''}
    function saveAccess(value){try{localStorage.setItem(STORE,value)}catch(e){}document.cookie=COOKIE+'='+encodeURIComponent(value)+'; Max-Age=31536000; Path=/HomepageProjekt/family-command/; Secure; SameSite=Strict'}
    function fatal(message){document.documentElement.dataset.fcReady='1';document.documentElement.dataset.fcStable='1';const root=document.querySelector('.content');if(root){root.textContent='';const section=document.createElement('section');section.className='screen active';section.innerHTML='<div class="v6-card" style="padding:18px"><h2 style="margin:0 0 6px">App konnte nicht vollständig geladen werden.</h2><p style="margin:0;color:#7b879b"></p></div>';section.querySelector('p').textContent=String(message||'Bitte die App einmal vollständig schließen und neu öffnen.');root.appendChild(section)}const nav=document.querySelector('.bottomnav'),add=document.getElementById('quickAdd');if(nav)nav.style.display='none';if(add)add.style.display='none'}
    let key=params.get('access')||readCookie(COOKIE)||'';if(!key){try{key=localStorage.getItem(STORE)||''}catch(e){}}
    if(params.get('access')){saveAccess(key);params.delete('access');const clean=location.pathname+(params.toString()?'?'+params.toString():'')+location.hash;history.replaceState(null,'',clean)}else if(key)saveAccess(key);
    if(!key){fatal('Privater Zugang erforderlich. Öffne deinen persönlichen Family-Command-Link einmal in Safari.');return}
    const browserFetch=window.fetch.bind(window),wait=ms=>new Promise(r=>setTimeout(r,ms)),frame=()=>new Promise(r=>requestAnimationFrame(r));
    window.fetch=function(input,init){try{const u=typeof input==='string'?input:(input instanceof Request?input.url:'');if(u.includes('/functions/v1/family-command-app/push/'))return Promise.resolve(new Response(JSON.stringify({ok:true,skipped:true}),{status:200,headers:{'content-type':'application/json'}}))}catch(e){}return browserFetch(input,init)};
    async function fetchText(src){let last='';for(let attempt=0;attempt<2;attempt++){try{const r=await browserFetch(src,{cache:attempt?'reload':'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status);return await r.text()}catch(e){last=e?.message||String(e);if(!attempt)await wait(80)}}throw new Error('Datei konnte nicht geladen werden: '+src+(last?' ('+last+')':''))}
    function execute(code,src){const s=document.createElement('script');s.textContent=code+'\n//# sourceURL='+src.split('?')[0];document.body.appendChild(s)}
    function readPrivateCache(){try{const x=JSON.parse(localStorage.getItem(PRIVATE_CACHE)||'null');return x&&x.version===VERSION&&typeof x.code==='string'?x.code:''}catch(e){return''}}
    function writePrivateCache(code){try{localStorage.setItem(PRIVATE_CACHE,JSON.stringify({version:VERSION,code,at:Date.now()}))}catch(e){}}
    function fetchPrivate(){return browserFetch(PRIVATE_APP+'?v='+VERSION,{cache:'no-store',headers:{'x-fc-access':key}}).then(async r=>{if(!r.ok)throw new Error('Privater App-Kern nicht erreichbar ('+r.status+').');return r.text()})}
    function idle(fn,delay=0){setTimeout(()=>{'requestIdleCallback'in window?requestIdleCallback(fn,{timeout:1500}):setTimeout(fn,20)},delay)}
    function loadExternal(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.async=true;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}
    function deferExtras(){let i=0;const next=()=>{if(i>=DEFERRED.length){document.documentElement.dataset.fcExtras='ready';return}const file=DEFERRED[i++];fetchText('./'+file+'?v='+VERSION).then(code=>execute(code,'./'+file+'?v='+VERSION)).catch(e=>console.error('fc_deferred',file,e)).finally(()=>idle(next,140))};idle(next,1200);idle(()=>{if(!window.jspdf)loadExternal('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js').catch(()=>{})},2500)}
    async function boot(){
      const start=performance.now(),cachedPrivate=readPrivateCache();
      const freshPrivate=fetchPrivate();
      const downloads=new Map(CRITICAL.map(file=>[file,fetchText('./'+file+'?v='+VERSION)]));
      if(cachedPrivate)execute(cachedPrivate,'family-command-private-app.cached.js');else execute(await freshPrivate,'family-command-private-app.js');
      if(typeof window.fcEventFilter==='undefined')window.fcEventFilter='all';
      for(const file of CRITICAL)execute(await downloads.get(file),'./'+file+'?v='+VERSION);
      document.documentElement.dataset.fcBoot='v8.4-lean-ok';
      const active=document.querySelector('.screen.active')?.id||'today';try{window.__fcV8Shell?.render?.(active)}catch(e){console.error('fc_v8_postboot',e)}
      await frame();document.documentElement.dataset.fcReady='1';await frame();document.documentElement.dataset.fcStable='1';document.documentElement.dataset.fcBootMs=String(Math.round(performance.now()-start));
      freshPrivate.then(code=>writePrivateCache(code)).catch(e=>console.error('fc_private_refresh',e));
      deferExtras();
    }
    boot().catch(e=>{console.error('family_command_boot',e);fatal(e?.message)});
  })();
  </script>
</body>
</html>
