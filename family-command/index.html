<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#263651">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Family Command">
  <title>Family Command</title>
  <link rel="manifest" href="./manifest.webmanifest?v=20260823-debug2">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon.svg">
  <link rel="stylesheet" href="./styles.css?v=20260820-2">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-in">
        <div class="brand">
          <div class="mark">FC</div>
          <div><h1>Family Command</h1><p>Alles Wichtige, bevor der Tag losgeht.</p></div>
        </div>
        <button class="iconbtn" id="quickAdd" aria-label="Schnell hinzufügen">＋</button>
      </div>
    </header>

    <main class="content">
      <section id="today" class="screen active"></section>
      <section id="week" class="screen"></section>
      <section id="people" class="screen"></section>
      <section id="events" class="screen"></section>
      <section id="more" class="screen"></section>
    </main>

    <nav class="bottomnav">
      <div class="bottomnav-in">
        <button class="navbtn active" data-screen="today"><span class="ico">⌂</span><span>Heute</span></button>
        <button class="navbtn" data-screen="week"><span class="ico">▦</span><span>Woche</span></button>
        <button class="navbtn" data-screen="people"><span class="ico">●</span><span>Personen</span></button>
        <button class="navbtn" data-screen="events"><span class="ico">◷</span><span>Termine</span></button>
        <button class="navbtn" data-screen="more"><span class="ico">•••</span><span>Mehr</span></button>
      </div>
    </nav>
  </div>

  <div class="modal" id="eventModal">
    <div class="sheet">
      <h3>Termin hinzufügen</h3>
      <div class="fields">
        <div class="field"><label>FÜR</label><select id="eventPerson"></select></div>
        <div class="field"><label>TITEL</label><input id="eventTitle" placeholder="z. B. Arzttermin"></div>
        <div class="row2">
          <div class="field"><label>DATUM</label><input id="eventDate" type="date"></div>
          <div class="field"><label>ZEIT</label><input id="eventTime" type="time"></div>
        </div>
        <div class="field"><label>NOTIZ</label><textarea id="eventNote" placeholder="Ort, was mitnehmen, weitere Infos …"></textarea></div>
        <button class="action" id="saveEvent">Speichern</button>
        <button class="action light" id="closeEvent">Abbrechen</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script>
  (()=>{
    const STORE='fc-private-access-v1',COOKIE='fc_private_access';
    const PRIVATE_APP='https://lmrvapstojcecljjdgds.supabase.co/functions/v1/family-command-private-app';
    const params=new URLSearchParams(location.search);
    function readCookie(name){const prefix=name+'=';const part=document.cookie.split(';').map(x=>x.trim()).find(x=>x.startsWith(prefix));return part?decodeURIComponent(part.slice(prefix.length)):''}
    function saveAccess(value){try{localStorage.setItem(STORE,value)}catch(e){}document.cookie=COOKIE+'='+encodeURIComponent(value)+'; Max-Age=31536000; Path=/HomepageProjekt/family-command/; Secure; SameSite=Strict'}
    function fatal(message){
      document.querySelector('.content').innerHTML='<section class="screen active"><div class="hero"><div class="eyebrow">Family Command</div><h2>App konnte nicht vollständig geladen werden.</h2><p>'+String(message||'Bitte die App einmal vollständig schließen und neu öffnen.')+'</p></div></section>';
      document.querySelector('.bottomnav').style.display='none';document.getElementById('quickAdd').style.display='none';
    }
    let key=params.get('access')||readCookie(COOKIE)||'';if(!key){try{key=localStorage.getItem(STORE)||''}catch(e){}}
    if(params.get('access')){saveAccess(key);params.delete('access');const clean=location.pathname+(params.toString()?'?'+params.toString():'')+location.hash;history.replaceState(null,'',clean)}else if(key)saveAccess(key);
    if(!key){fatal('Privater Zugang erforderlich. Öffne deinen persönlichen Family-Command-Link einmal in Safari.');return}

    const browserFetch=window.fetch.bind(window);
    window.fetch=function(input,init){
      try{const u=typeof input==='string'?input:(input instanceof Request?input.url:'');if(u.includes('/functions/v1/family-command-app/push/'))return Promise.resolve(new Response(JSON.stringify({ok:true,skipped:true}),{status:200,headers:{'content-type':'application/json'}}))}catch(e){}
      return browserFetch(input,init);
    };

    function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=()=>resolve();s.onerror=()=>reject(new Error('Datei konnte nicht geladen werden: '+src));document.body.appendChild(s)})}
    function injectPrivate(code){const s=document.createElement('script');s.textContent=code+'\n//# sourceURL=family-command-private-app.js';document.body.appendChild(s)}

    async function boot(){
      const r=await browserFetch(PRIVATE_APP+'?v=20260823-debug2',{cache:'no-store',headers:{'x-fc-access':key}});
      if(!r.ok)throw new Error('Privater App-Kern nicht erreichbar ('+r.status+').');
      injectPrivate(await r.text());
      if(typeof window.fcEventFilter==='undefined')window.fcEventFilter='all';

      await loadScript('./ai-budget-guard.js?v=20260823-debug2');
      await loadScript('./push-v2.js?v=20260823-debug2');
      await loadScript('./pro-ui.js?v=20260823-debug2');
      await loadScript('./balanced-ui.js?v=20260823-debug2');
      await loadScript('./layout-safety.js?v=20260823-debug2');
      await loadScript('./family-ai.js?v=20260823-debug2');
      await loadScript('./pendencies.js?v=20260823-debug2');
      await loadScript('./event-details.js?v=20260823-debug2');
      await loadScript('./runtime-health.js?v=20260823-debug2');
      await loadScript('./event-delete-fix.js?v=20260823-debug2');
      document.documentElement.dataset.fcBoot='debug2-ok';
    }
    boot().catch(e=>{console.error('family_command_boot',e);fatal(e?.message)});
  })();
  </script>
</body>
</html>
